---
# Ubuntu's snapd package sets up "/snap" automatically (as a real, populated
# directory that snapd itself manages — NOT a symlink, confirmed live
# against this repo's own real Ubuntu host); Debian's does not (documented
# Debian wiki gotcha) — without it, classic confinement snaps (kubectl,
# helm below) fail to resolve their paths. "force: true" is required for
# the fresh-container case this was written for: /var/lib/snapd/snap
# doesn't exist yet immediately after installing the snapd package (only
# snapd itself creates it, on first run), and ansible.builtin.file's "link"
# state refuses to create a symlink to a target that doesn't exist yet
# unless forced.
#
# Only attempted when "/snap" doesn't exist at all yet: confirmed live
# against this repo's own real (long-lived, snaps-already-installed) Ubuntu
# host that forcing this unconditionally is actively dangerous there —
# "/snap" already exists as a real, non-empty directory (snapd's own mount
# point), and ansible.builtin.file's own safety check refuses to convert a
# non-empty directory into a symlink ("the directory /snap is not empty,
# refusing to convert it"), which is exactly what saved this host from
# having its entire snap mount namespace replaced by a broken symlink. The
# original "harmless no-op on Ubuntu" assumption behind the unconditional
# form only held in this role's own throwaway test containers, where
# "/snap" starts out empty or missing — never verified against a real,
# already-provisioned host until now.
- name: Check whether /snap already exists
  ansible.builtin.stat:
    path: /snap
  register: lxd_snap_dir_stat
  when: ansible_facts.os_family != 'Suse'

- name: Ensure the classic snap mount point exists (required on Debian, already present on Ubuntu)
  ansible.builtin.file:
    src: /var/lib/snapd/snap
    dest: /snap
    state: link
    force: true
  when: ansible_facts.os_family != 'Suse' and not lxd_snap_dir_stat.stat.exists

# retries/until: confirmed live (Debian 13, Fedora 44) that right after
# installing snapd for the first time, it self-updates to its own internal
# snap and restarts (version jumping e.g. from 2.68.3 to 2.76.2 in the
# journal) — if a snap operation lands exactly in that restart window,
# community.general.snap misreads it as empty output and fails with an
# internal exception ("list index out of range": the module only
# recognizes the exact string "warning: no snap found", any other "snap
# info" failure confuses it the same way). A generous retry budget (up to
# 3 minutes total) gives snapd time to settle.
- name: Install LXD, kubectl and helm via snap
  community.general.snap:
    name: "{{ item.name }}"
    state: present
    classic: "{{ item.classic | default(omit) }}"
  loop: "{{ lxd_snap_packages }}"
  when: ansible_facts.os_family != 'Suse'
  register: lxd_snap_install
  retries: 12
  delay: 15
  until: lxd_snap_install is succeeded

# openSUSE Leap 16.0 (stable) still publishes "lxd" natively, with the
# "ubuntu:" remote already configured out of the box just like the snap —
# confirmed live, no compat naming needed (see lxd_uses_incus in
# defaults/main.yml).
- name: Install LXD and helm via native zypper packages (openSUSE Leap only — no snapd)
  ansible.builtin.package:
    name:
      - lxd
      - helm
    state: present
  when: ansible_facts.os_family == 'Suse' and not lxd_uses_incus

- name: Ensure the lxd systemd service is enabled and started (openSUSE Leap only)
  ansible.builtin.systemd:
    name: lxd
    enabled: true
    state: started
  when: ansible_facts.os_family == 'Suse' and not lxd_uses_incus

# openSUSE Tumbleweed retired the "lxd" package from its official repos
# (confirmed live, 2026-08-15: "zypper se -s lxd" only returns unrelated
# packages) — only "incus" (the community LXD fork, same lineage, REST
# API/CLI compatible) is published there. "iptables" is a real dependency
# not pulled in automatically by the "incus" package: confirmed live that
# without it, "incus admin init --preseed" fails to set up the managed
# network's firewall ("iptables: executable file not found in $PATH").
- name: Install Incus via zypper (openSUSE Tumbleweed only — no longer publishes "lxd")
  ansible.builtin.package:
    name:
      - incus
      - iptables
    state: present
  when: lxd_uses_incus

# The rest of this role (and every role/lab that consumes it) invokes
# "lxc"/"lxd" directly. incus deliberately keeps its CLI compatible with
# classic lxc syntax (image, network, exec, launch...) — confirmed live
# that "lxc image copy", "lxc network show" and "lxc launch --vm" all work
# unchanged through a plain symlink. The one real exception is daemon
# initialization (see lxd_init_cmd in defaults/main.yml: "incus admin init"
# is a subcommand of the client binary, unlike "lxd init", a subcommand of
# the daemon itself).
- name: Create lxc/lxd -> incus/incusd compat symlinks (openSUSE Tumbleweed only)
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: /usr/bin/incus, dest: /usr/local/bin/lxc }
    - { src: /usr/sbin/incusd, dest: /usr/local/bin/lxd }
  when: lxd_uses_incus

- name: Ensure the incus systemd units are enabled and started (openSUSE Tumbleweed only)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - incus.socket
    - incus
  when: lxd_uses_incus

# community.general.lxd_container/lxd_storage_volume_info (used throughout
# lxd_machine_provision/k8s_ha_cluster/etc., ~50 call sites) talk to LXD's
# REST API directly over "unix:/var/lib/lxd/unix.socket" by default, with
# no environment-variable override — only a fixed "url:" parameter that
# none of those tasks pass today. Rather than touching every call site,
# link LXD's default socket path to incus's real one
# ("/run/incus/unix.socket") — confirmed live that, since incus keeps its
# REST API compatible with LXD's, those modules work unmodified through
# this symlink. openSUSE Leap doesn't need this: its native "lxd" already
# uses this exact socket path directly, no symlink involved.
- name: Ensure /var/lib/lxd exists (openSUSE Tumbleweed only)
  ansible.builtin.file:
    path: /var/lib/lxd
    state: directory
    mode: "0755"
  when: lxd_uses_incus

- name: Link the default LXD socket path to incus's real socket (openSUSE Tumbleweed only)
  ansible.builtin.file:
    src: /run/incus/unix.socket
    dest: /var/lib/lxd/unix.socket
    state: link
    force: true
  when: lxd_uses_incus

- name: Query the latest stable kubectl version (openSUSE only — no native package)
  ansible.builtin.uri:
    url: https://dl.k8s.io/release/stable.txt
    return_content: true
  register: lxd_kubectl_stable_version
  when: ansible_facts.os_family == 'Suse'

- name: Download and install kubectl (openSUSE only — no native package)
  ansible.builtin.get_url:
    url: >-
      https://dl.k8s.io/release/{{ lxd_kubectl_stable_version.content | trim }}/bin/linux/
      {{- 'amd64' if ansible_facts.architecture == 'x86_64' else 'arm64' }}/kubectl
    checksum: >-
      sha256:https://dl.k8s.io/release/{{ lxd_kubectl_stable_version.content | trim }}/bin/linux/
      {{- 'amd64' if ansible_facts.architecture == 'x86_64' else 'arm64' }}/kubectl.sha256
    dest: /usr/local/bin/kubectl
    mode: "0755"
  when: ansible_facts.os_family == 'Suse'
