---
- name: Load the OS-family-specific package list
  ansible.builtin.include_vars: "{{ ansible_facts.os_family }}.yml"

# snapd/python3-kubernetes/python3-jsonpatch aren't in the base RHEL-family
# repos — Fedora carries them in its own repos already, but Rocky/RHEL/
# CentOS need EPEL enabled first (confirmed live: without this, the next
# task fails to resolve those package names on Rocky 9).
- name: Enable the EPEL repository (Rocky/RHEL/CentOS only, not Fedora)
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_facts.os_family == 'RedHat' and ansible_facts.distribution != 'Fedora'

- name: Install system dependencies (snapd, curl, Python libraries)
  ansible.builtin.package:
    name: "{{ lxd_system_packages }}"
    state: present
    update_cache: true

# Confirmed live (Rocky Linux 9): the EPEL "snapd" package, unlike
# Debian/Ubuntu/Fedora's, does NOT activate "snapd.socket" automatically on
# install (it stays "disabled"/"inactive"). Without this, the LXD snap
# install in snap_packages.yml hangs indefinitely trying to reach
# /run/snapd.socket, which never comes up on its own — not a timing issue
# retries can fix, the socket genuinely never self-activates on this distro.
- name: "Ensure the snapd socket is enabled and started (RedHat family: Rocky/RHEL/CentOS)"
  ansible.builtin.systemd:
    name: snapd.socket
    enabled: true
    state: started
  when: ansible_facts.os_family == 'RedHat'

# Explicitly targets lxd_host_user (see ssh_keypair.yml for why) so the
# collections land in that user's ~/.ansible/collections, not root's, since
# labs are run by that user directly, without sudo.
#
# Requires the "ansible-galaxy" executable to already be present on the
# target — trivially true for this role's real usage (connection: local,
# the same machine already running ansible-playbook to get this far), but
# NOT true if this role is ever pointed at a genuinely separate/fresh
# target over a remote connection (confirmed live via the distro test
# harness in ansible/scripts/, which does exactly that). Tagged so such a
# test can skip it explicitly instead of failing on an assumption the role
# was never meant to make in its normal (local) usage.
#
# The explicit PATH is required whenever this play is itself invoked as
# root (e.g. "sudo ansible-playbook ..." — exactly the scenario
# lxd_host_user's own SUDO_USER fallback in defaults/main.yml anticipates,
# and how this role's own "sudo -E molecule test" runs it): de-escalating
# from root to lxd_host_user via become_user is a REAL privilege change in
# that case (not a no-op, unlike when already connected as that same
# user), and sudo resets PATH to its secure_path, dropping ~/.local/bin —
# exactly where pipx installs ansible-galaxy (see
# ansible/base/00_instalar_ansible.sh). Confirmed live: this task failed
# with "Failed to find required executable 'ansible-galaxy'" under
# "sudo -E molecule test" without it.
- name: Ensure required Ansible Galaxy collections are installed and up to date
  # No "state:" (neither "latest" nor "present"): "latest" forces --upgrade
  # on every run, which hits Galaxy's API and its local response cache —
  # confirmed live that code path is fragile ("Missing expected 'results'
  # in ansible-galaxy cache", a known ansible-galaxy bug) even when the
  # collection is already installed. The "state" parameter itself doesn't
  # even exist in older community.general versions that pip/pipx can
  # resolve on a system with an old Python (confirmed live: Rocky Linux 9's
  # system Python 3.9 resolves community.general 7.5.2 via "pipx install
  # ansible", whose ansible_galaxy_install module rejects "state" outright
  # as an unsupported parameter). Omitting it is compatible with both: the
  # default behavior in both versions is "install if missing, don't touch
  # network/cache if already present".
  community.general.ansible_galaxy_install:
    name: "{{ item }}"
    type: collection
  loop: "{{ lxd_galaxy_collections }}"
  become: true
  become_user: "{{ lxd_host_user }}"
  environment:
    PATH: "/home/{{ lxd_host_user }}/.local/bin:{{ ansible_facts.env.PATH }}"
  tags: [requires_ansible_control_node]
