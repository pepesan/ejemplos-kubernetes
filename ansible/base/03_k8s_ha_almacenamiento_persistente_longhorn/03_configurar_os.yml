---
# Diferencias respecto al 03_configurar_os.yml del ejemplo 02 (base HA sin storage):
# - Aquí NO se reescribe el ajuste base del sistema operativo (swap, módulos de kernel,
#   sysctl, /dev/kmsg, etc.): se reutiliza tal cual importando el playbook del 02 con
#   `import_playbook`, para no duplicar esa lógica entre laboratorios.
# - Se añade un segundo play, exclusivo de este escenario, que instala los paquetes de
#   sistema que Longhorn necesita en cada nodo para poder montar sus volúmenes:
#     * open-iscsi / iscsi-initiator-utils: Longhorn expone cada réplica de volumen como
#       un target iSCSI local; sin el iniciador iSCSI el kubelet no puede montarlos.
#     * nfs-common / nfs-utils: necesario para el modo ReadWriteMany (RWX), que Longhorn
#       implementa reexportando el volumen por NFS.
# - El servicio `iscsid` debe quedar arrancado y habilitado en el arranque, si no
#   longhorn-manager falla al intentar hacer login en los targets iSCSI locales.
- import_playbook: ../02_k8s_base_ha_3_managers_3_workers/03_configurar_os.yml

- name: Instalar requisitos adicionales de Longhorn (iscsid/nfs) en todos los nodos
  hosts: k8s_nodes
  gather_facts: true
  tasks:
    # Los nodos guest de estos laboratorios son siempre Ubuntu (imagen
    # k8s-template), así que en la práctica esto solo ejecuta la rama
    # Debian — pero se generaliza por os_family igual que el rol
    # k8s_ha_cluster (extraído de este mismo lab), por si en el futuro se
    # amplía el soporte de distro de los nodos guest.
    - name: Instalar dependencias de almacenamiento de Longhorn (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - open-iscsi
          - nfs-common
        state: present
        update_cache: true
        lock_timeout: 300
      when: ansible_facts.os_family == 'Debian'

    - name: Instalar dependencias de almacenamiento de Longhorn (Rocky/Fedora)
      ansible.builtin.dnf:
        name:
          - iscsi-initiator-utils
          - nfs-utils
        state: present
      when: ansible_facts.os_family == 'RedHat'

    - name: Asegurar que el servicio iscsid está iniciado y habilitado en el arranque
      ansible.builtin.systemd:
        name: iscsid
        state: started
        enabled: true
