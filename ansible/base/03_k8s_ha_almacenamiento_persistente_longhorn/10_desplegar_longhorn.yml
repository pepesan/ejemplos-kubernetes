---
# Aquí, en cambio, el 10 despliega el motor de almacenamiento distribuido
# Longhorn, que es el objetivo central de este laboratorio 03:
# - Etiqueta los nodos según su rol (workload vs. storage) definido en el inventory.ini
#   (grupos `workload_workers` / `storage_workers`), para que Longhorn sepa dónde crear
#   discos por defecto (solo en storage) y dónde no.
# - Aplica el taint `storage-node=true:NoSchedule` a los nodos de storage para que
#   ningún pod de aplicación normal se programe ahí — solo correrán réplicas de datos
#   y los propios componentes de Longhorn (que toleran ese taint explícitamente).
# - Instala Longhorn vía Helm con 3 réplicas por defecto (una por cada nodo de storage)
#   y expone su UI de administración como NodePort en el puerto 32085.
- name: Desplegar Longhorn en Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubeconfig_path: "{{ playbook_dir }}/kubeconfig.yaml"
  tasks:
    # Parcheamos objetos Node ya existentes en Kubernetes (creados por kubeadm join en
    # el 08_unir_workers.yml): "kind: Node" + "state: present" con un nombre que ya
    # existe no crea un nodo nuevo, solo le añade/actualiza las labels indicadas.
    # node.longhorn.io/workload-node es puramente informativa: no la lee ningún
    # controlador de Longhorn ni afecta al scheduling; sirve solo para poder
    # identificar a golpe de vista, con `kubectl get nodes -l ...`, qué nodos son de
    # cómputo puro frente a los de storage.
    - name: Etiquetar los nodos workload
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Node
          metadata:
            name: "{{ item }}"
            labels:
              node.longhorn.io/workload-node: "true"
      loop: "{{ groups['workload_workers'] }}"

    # Estas dos labels sí las consume Longhorn directamente (longhorn-manager las
    # vigila mediante un webhook/controller propio, no son solo metadata):
    # - node.longhorn.io/storage-node: igual que la de workload, es informativa para
    #   humanos/`kubectl -l`; no la usa ningún controlador de Longhorn para decidir nada.
    # - node.longhorn.io/create-default-disk: "true": esta SÍ dispara comportamiento.
    #   Combinada con "defaultSettings.createDefaultDiskLabeledNodes: true" (ver el
    #   values de Helm más abajo), le dice a longhorn-manager "crea automáticamente un
    #   disco por defecto (usando el path /var/lib/longhorn) en este nodo concreto".
    #   Sin esta label, con createDefaultDiskLabeledNodes activado, Longhorn NO crea
    #   ningún disco en el nodo — por eso los workers de cómputo (sin esta label)
    #   terminan sin espacio de almacenamiento asignado, tal y como se ve en Headlamp.
    - name: Etiquetar los nodos storage para Longhorn
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Node
          metadata:
            name: "{{ item }}"
            labels:
              node.longhorn.io/storage-node: "true"
              node.longhorn.io/create-default-disk: "true"
      loop: "{{ groups['storage_workers'] }}"

    # Se usa `ansible.builtin.command` con `kubectl taint` en vez del módulo
    # `kubernetes.core.k8s` porque ese módulo no gestiona taints de nodo (solo
    # labels/anotaciones vía "metadata"); el taint es un campo de "spec", así que hace
    # falta el comando directo. El `failed_when`/`changed_when` personalizados existen
    # porque `kubectl taint` devuelve rc≠0 si el taint ya existía en una ejecución
    # anterior (el playbook debe ser idempotente: no fallar al repetirse) — se detecta
    # ese caso concreto buscando "already has" en stderr para no tratarlo como error,
    # y solo se marca como "changed" cuando kubectl confirma que aplicó un taint nuevo.
    - name: Aplicar taints de almacenamiento a los nodos worker
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }} taint node {{ item }} storage-node=true:NoSchedule
      loop: "{{ groups['storage_workers'] }}"
      register: taint_out
      failed_when:
        - taint_out.rc != 0
        - "'already has' not in taint_out.stderr"
      changed_when: "'tainted' in taint_out.stdout"

    # Registra (o actualiza, con force_update) el repositorio Helm oficial de Longhorn
    # en la caché local de Helm de la máquina que ejecuta Ansible — paso previo
    # obligatorio antes de poder instalar `chart_ref: longhorn/longhorn` en la tarea
    # siguiente, igual que un `helm repo add longhorn https://charts.longhorn.io`.
    - name: Agregar el repositorio de Longhorn a Helm
      kubernetes.core.helm_repository:
        name: longhorn
        repo_url: https://charts.longhorn.io
        force_update: true

    # Namespace dedicado donde vivirán TODOS los componentes de Longhorn (longhorn-
    # manager, longhorn-driver-deployer, longhorn-ui, longhorn-csi-plugin, instance-
    # manager...). Se crea aparte porque el chart de Helm, con `helm install`, no
    # crea el namespace de destino por sí solo si no existe ya.
    - name: Crear namespace longhorn-system si no existe
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: longhorn-system

    # `values:` aquí es exactamente el equivalente de un fichero values.yaml pasado
    # con `helm install -f values.yaml` — el detalle de cada clave va comentado en su
    # propia línea, justo al lado.
    - name: Instalar o actualizar Longhorn usando Helm
      kubernetes.core.helm:
        name: longhorn
        chart_ref: longhorn/longhorn
        chart_version: "{{ longhorn_chart_version }}"
        release_namespace: longhorn-system
        kubeconfig: "{{ kubeconfig_path }}"
        values:
          defaultSettings:
            # Solo los nodos con la label create-default-disk=true (los de storage,
            # ver tarea de arriba) reciben un disco por defecto. Si esto fuera false,
            # Longhorn crearía un disco en TODOS los nodos del clúster, incluidos los
            # de cómputo, justo lo que se quiere evitar en este laboratorio.
            createDefaultDiskLabeledNodes: true
            # Cuántas copias de cada bloque de datos mantiene Longhorn (una por cada
            # uno de los 3 nodos de storage). Es lo que da tolerancia a fallos: se
            # puede perder 1 nodo de storage sin perder datos.
            defaultReplicaCount: 3
            # Instruye a Longhorn para que TODOS sus componentes de sistema
            # (instance-manager, engine images, csi-plugin..., desplegados como
            # DaemonSet) toleren el taint aplicado antes a los nodos de storage. Sin
            # esto, aunque el nodo tenga el disco etiquetado, los propios pods de
            # Longhorn no podrían programarse ahí.
            taintToleration: "storage-node=true:NoSchedule"
          persistence:
            # Crea la StorageClass "longhorn" marcada como default del clúster, para
            # que cualquier PVC sin `storageClassName` explícito la use automáticamente.
            defaultClass: true
            # Nº de réplicas que usarán los PVC creados contra esa StorageClass por
            # defecto (mismo valor que defaultSettings.defaultReplicaCount de arriba).
            defaultClassReplicaCount: 3
          longhornManager:
            # Toleration equivalente a defaultSettings.taintToleration pero aplicada
            # explícitamente al DaemonSet longhorn-manager en concreto (el que
            # registra los discos y nodos); se declara aparte porque en algunas
            # versiones del chart no hereda automáticamente el taintToleration general.
            tolerations:
              - key: storage-node
                operator: Equal
                value: "true"
                effect: NoSchedule
          service:
            ui:
              # Expone el Dashboard web de Longhorn en el puerto fijo 32085 de
              # cualquier nodo del clúster, accesible sin `kubectl port-forward`
              # (de ahí la URL con la VIP en el mensaje final del playbook).
              type: NodePort
              nodePort: 32085

    # longhorn-manager es un DaemonSet: corre un pod en cada nodo tolerado (workers de
    # cómputo + storage, gracias a las tolerations configuradas arriba). Es el
    # componente que registra discos/nodos y gestiona el ciclo de vida de los
    # volúmenes, así que hay que esperar a que su rollout termine antes de continuar
    # — si no, las tareas siguientes (o el playbook 11) podrían encontrarse con la UI
    # o el CSI a medio inicializar. 300s de margen porque tiene que arrancar en todos
    # los nodos del clúster (5 workers) a la vez.
    - name: Esperar a que Longhorn Manager esté listo en nodos de cómputo y almacenamiento
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }} rollout status daemonset/longhorn-manager -n longhorn-system --timeout=300s
      changed_when: false

    # longhorn-ui es un Deployment normal (no DaemonSet, corre en un único nodo): es
    # la SPA web del dashboard de administración, la que quedará expuesta en el
    # NodePort 32085 configurado en el values de Helm. Se espera aparte del manager
    # porque su imagen y arranque son independientes y no bloquean al resto de
    # componentes de Longhorn si tardan más.
    - name: Esperar a que el deployment de la interfaz de Longhorn esté listo
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }} rollout status deployment/longhorn-ui -n longhorn-system --timeout=180s
      changed_when: false

    # Tarea puramente informativa (no toca el clúster): resume para quien ejecuta el
    # playbook dónde y cómo acceder al resultado, y recuerda la configuración clave
    # aplicada (réplicas, taints) sin tener que ir a revisar el resto del fichero.
    - name: Mostrar datos de acceso al Panel de Longhorn
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "  ¡LONGHORN DESPLEGADO CON ÉXITO!"
          - "  "
          - "  Panel de Administración de Longhorn: http://{{ k8s_vip_address }}:32085"
          - "  "
          - "  StorageClass por defecto: 'longhorn'"
          - "  Número de réplicas configurado: 3 (óptimo para 3 workers de storage)"
          - "  "
          - "  Taints aplicados a nodos de storage: storage-node=true:NoSchedule"
          - "  Discos por defecto limitados a nodos etiquetados como storage."
          - "════════════════════════════════════════════════════════════════"
