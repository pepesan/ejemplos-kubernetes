---
# Conexión SSH: acceso como root sin contraseña (clave inyectada en la imagen base)
ansible_user: root
ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# Parámetros de los nodos virtuales LXD (La plantilla 'k8s-template' debe estar basada en Ubuntu 26.04)
lxd_image: k8s-template
lxd_network: lxdbr0

# Módulos de kernel necesarios para Kubernetes/CNI en LXD
lxd_kernel_modules: "overlay,br_netfilter,ip_tables,ip6_tables,ipt_MASQUERADE,iptable_mangle,iptable_nat,iptable_filter,nf_nat,nf_conntrack"

# Versión de Kubernetes con la que se despliega el clúster inicialmente.
# El laboratorio la actualiza después a "k8s_upgrade_target_version".
# ⚠️ A diferencia del resto de variables de este fichero, esta NO se sincroniza con el
# k8s_major_version del ejemplo 02: el objetivo de este lab es precisamente demostrar
# el salto entre dos versiones consecutivas, así que debe poder fijar una versión
# "vieja" (la que fue estándar en el resto de labs hasta el bump anterior) aunque el 02
# ya haya avanzado a una más nueva. Por eso 05_instalar_k8s_tools.yml de ESTE lab ya NO
# es un import_playbook del 02 (ver ese fichero para el detalle del porqué).
k8s_major_version: "v1.36"
k8s_upgrade_target_version: "v1.37"
k8s_pod_network_cidr: "10.244.0.0/16" # CIDR estándar para Flannel CNI

# VIP de alta disponibilidad del plano de control (kube-vip)
# No debe coincidir con ninguna IP de inventory.ini
k8s_vip_address: "10.207.154.49"
k8s_vip_port: 6443
k8s_vip_interface: enp5s0
kube_vip_image: "ghcr.io/kube-vip/kube-vip:v1.2.3"

# Versión del chart de Headlamp
headlamp_chart_version: "0.45.0"
