---
- name: Instalar Cephadm y preparar requerimientos en todos los nodos Ceph
  hosts: ceph_nodes
  become: true
  gather_facts: true
  tasks:
    - name: Crear el grupo 'ceph' con GID 167 (requerido por cephadm y los contenedores de Ceph)
      ansible.builtin.group:
        name: ceph
        gid: 167
        system: true
        state: present

    - name: Crear el usuario 'ceph' con UID 167 (requerido por cephadm y los contenedores de Ceph)
      ansible.builtin.user:
        name: ceph
        uid: 167
        group: ceph
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Añadir el repositorio de Ceph
      ansible.builtin.apt:
        name:
          - cephadm
          - python3-ceph-common
          - ceph-common
        state: present
        update_cache: true
        lock_timeout: 300

    - name: Asegurar que el daemon de SSH está activo y configurado
      ansible.builtin.systemd:
        name: ssh
        state: started
        enabled: true

    # El paquete 'ceph-common' del repositorio de Ubuntu queda fijado a una
    # versión concreta (ej. 20.2.0), mientras que 'cephadm bootstrap' sin
    # --image descarga por defecto la última imagen de la tag flotante
    # "vXX" (ej. quay.io/ceph/ceph:v20 → 20.2.4 en el momento de escribir
    # esto). Ambas versiones pueden divergir en el formato interno del
    # keyring, y entonces la CLI 'ceph' del host (más antigua) no consigue
    # parsear el keyring generado por los daemons del contenedor (más
    # nuevo): falla con "Malformed input [buffer:N]" al intentar cualquier
    # comando, aunque el clúster esté sano. Fijar aquí la misma versión
    # exacta que se acaba de instalar por apt evita esa divergencia.
    - name: Obtener la versión exacta de Ceph instalada por apt en el host
      ansible.builtin.command: ceph --version
      register: ceph_version_out
      changed_when: false

    - name: Guardar la versión de Ceph en memoria (para pinear la imagen de cephadm)
      ansible.builtin.set_fact:
        ceph_installed_version: "{{ ceph_version_out.stdout.split(' ')[2] }}"

- name: Inicializar Clúster Ceph en el primer nodo de control (mon+mgr)
  hosts: ceph_control_bootstrap
  become: true
  gather_facts: false
  vars:
    # Contraseña generada una única vez y persistida en un archivo local fuera
    # del control de versiones (ver .gitignore); en ejecuciones posteriores se
    # reutiliza la misma en vez de generar una nueva.
    ceph_dashboard_password: "{{ lookup('ansible.builtin.password', playbook_dir + '/ceph_dashboard_password.txt', length=20, chars=['ascii_letters', 'digits']) }}"
  tasks:
    - name: Comprobar si Ceph ya está inicializado
      ansible.builtin.stat:
        path: /etc/ceph/ceph.conf
      register: ceph_conf_stat

    - name: Inicializar clúster Ceph con cephadm bootstrap
      # --skip-monitoring-stack: cephadm despliega por defecto su propia pila
      # completa (Prometheus, Grafana, node-exporter, alertmanager) como
      # contenedores gestionados por el propio orquestador de Ceph; en este
      # laboratorio ese stack se sustituye por el de 07_k8s_observabilidad_*
      # dentro del propio clúster de Kubernetes, así que se omite para no
      # duplicar servicios ni malgastar recursos en las VMs de Ceph.
      # --allow-fqdn-hostname: cephadm rechaza por defecto hostnames que
      # contengan un punto (los interpreta como FQDN, no como el nombre corto
      # que espera para identificar el nodo); el hostname de las VMs de LXD
      # en este laboratorio sí incluye el dominio, así que hay que permitirlo
      # explícitamente o el bootstrap falla antes de arrancar ningún daemon.
      # --image: fija la imagen de contenedor a la misma versión de Ceph que
      # el 'ceph-common' instalado por apt en el host (ver tarea anterior,
      # ceph_installed_version); sin esto, cephadm usa la tag flotante "vXX"
      # (la última patch release disponible), que puede no coincidir con la
      # versión del paquete apt y producir un keyring que la CLI del host no
      # sabe parsear. El repositorio de la imagen es configurable en
      # group_vars/all.yml (ceph_container_image_repo); el tag no, a propósito.
      ansible.builtin.command: >
        cephadm
        --image {{ ceph_container_image_repo }}:v{{ ceph_installed_version }}
        bootstrap
        --mon-ip {{ ansible_host }}
        --initial-dashboard-user admin
        --initial-dashboard-password {{ ceph_dashboard_password | quote }}
        --skip-monitoring-stack
        --allow-fqdn-hostname
      register: bootstrap_out
      when: not ceph_conf_stat.stat.exists
      changed_when: true

    - name: Leer clave SSH pública generada por Ceph
      ansible.builtin.slurp:
        src: /etc/ceph/ceph.pub
      register: ceph_pub_key_b64

    - name: Guardar clave pública de Ceph en memoria
      ansible.builtin.set_fact:
        ceph_ssh_key: "{{ ceph_pub_key_b64.content | b64decode }}"

- name: Distribuir clave SSH de Ceph a los nodos OSD y de control adicionales
  # El nodo de bootstrap (ceph_control_bootstrap) no necesita esta distribución:
  # cephadm añade su propia clave pública a su propio authorized_keys durante
  # el bootstrap. Solo hacen falta los nodos OSD y los 2 nodos de control
  # adicionales (mon+mgr) que el orquestador todavía no puede alcanzar por SSH.
  hosts: ceph_osds:ceph_control_additional
  become: true
  gather_facts: false
  tasks:
    - name: Añadir clave SSH de Ceph a authorized_keys
      ansible.builtin.authorized_key:
        user: root
        state: present
        key: "{{ hostvars[groups['ceph_control_bootstrap'][0]]['ceph_ssh_key'] }}"

- name: Integrar OSDs, nodos de control y aprovisionar almacenamiento en el Clúster Ceph
  hosts: ceph_control_bootstrap
  become: true
  gather_facts: false
  vars:
    ceph_dashboard_password: "{{ lookup('ansible.builtin.password', playbook_dir + '/ceph_dashboard_password.txt', length=20, chars=['ascii_letters', 'digits']) }}"
  tasks:
    - name: Esperar a que el orquestador de Ceph esté listo
      ansible.builtin.command: ceph orch status
      register: orch_status
      until: orch_status.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Añadir hosts de OSDs al orquestador Ceph
      ansible.builtin.command: >
        ceph orch host add {{ item }} {{ hostvars[item].ansible_host }}
      loop: "{{ groups['ceph_osds'] }}"
      register: host_add_out
      failed_when:
        - host_add_out.rc != 0
        - "'already exists' not in host_add_out.stderr"
      changed_when: "'Added host' in host_add_out.stdout"

    - name: Añadir los 2 nodos de control adicionales (mon+mgr) al orquestador Ceph
      # Solo los 2 adicionales: el nodo de bootstrap (ceph_control_bootstrap) ya
      # queda registrado automáticamente por 'cephadm bootstrap' como su propio
      # primer host, no hace falta (ni conviene) volver a darlo de alta aquí.
      ansible.builtin.command: >
        ceph orch host add {{ item }} {{ hostvars[item].ansible_host }}
      loop: "{{ groups['ceph_control_additional'] }}"
      register: mgr_host_add_out
      failed_when:
        - mgr_host_add_out.rc != 0
        - "'already exists' not in mgr_host_add_out.stderr"
      changed_when: "'Added host' in mgr_host_add_out.stdout"

    # 'cephadm bootstrap' solo distribuye /etc/ceph/ceph.conf y el keyring de
    # client.admin al propio host de bootstrap (el único con la etiqueta
    # '_admin' por defecto). Sin este paso, si ese nodo cae o se destruye
    # (ej. al escalar/quitar nodos de ceph_control), ningún otro nodo de
    # control puede ejecutar comandos 'ceph' con privilegios de admin — los
    # comandos delegados a ellos fallan de forma silenciosa si la tarea que
    # los ejecuta tiene 'failed_when: false' (ver 16_eliminar_nodo.yml).
    # Etiquetar los 2 nodos adicionales como '_admin' hace que cephadm les
    # distribuya también la config y el keyring, para que cualquiera de los
    # 3 nodos de ceph_control pueda administrar el clúster, no solo el de
    # bootstrap.
    - name: Etiquetar los nodos de control adicionales como '_admin' (acceso admin en los 3)
      ansible.builtin.command: >
        ceph orch host label add {{ item }} _admin
      loop: "{{ groups['ceph_control_additional'] }}"
      register: admin_label_out
      changed_when: "'Added label' in admin_label_out.stdout"

    - name: Esperar a que ceph.conf y el keyring de admin lleguen a los nodos etiquetados
      ansible.builtin.stat:
        path: /etc/ceph/ceph.client.admin.keyring
      register: admin_keyring_stat
      delegate_to: "{{ item }}"
      loop: "{{ groups['ceph_control_additional'] }}"
      until: admin_keyring_stat.stat.exists
      retries: 24
      delay: 5

    - name: Comprobar el placement actual de la especificación de mgr
      # A diferencia de osd.all-available-devices (que no existe hasta que se
      # aplica más abajo), aquí SIEMPRE hay una spec de mgr desde el propio
      # 'cephadm bootstrap' inicial (colocada por defecto en el nodo de
      # bootstrap). Por eso no basta con "existe o no" para decidir cuándo hay
      # cambio real: hay que comparar el placement actual contra el deseado.
      ansible.builtin.command: ceph orch ls --service-name mgr --format json
      register: mgr_spec_check
      changed_when: false

    - name: Aplicar 3 managers repartidos en los nodos de control dedicados (mon+mgr)
      ansible.builtin.command: >
        ceph orch apply mgr --placement="{{ groups['ceph_control'] | join(',') }}"
      # 'ceph orch apply mgr' devuelve rc=0 con "Scheduled" tanto si cambia el
      # placement como si se reaplica el mismo; se compara explícitamente la
      # lista de hosts de la spec actual (mgr_spec_check, leído antes de este
      # 'apply') contra la deseada para no marcar "changed" en cada
      # reejecución. 'default([])' cubre el caso de que la spec inicial del
      # bootstrap use placement por "count" en vez de una lista de hosts.
      changed_when: >-
        (mgr_spec_check.stdout | from_json | first).placement.hosts | default([]) | sort
        != groups['ceph_control'] | sort

    - name: Esperar a que los 3 managers estén activos (1 activo + 2 standby)
      ansible.builtin.command: ceph orch ps --daemon-type mgr -f json
      register: mgr_ps
      until: (mgr_ps.stdout | from_json | length) >= 3
      retries: 30
      delay: 10
      changed_when: false

    - name: Comprobar el placement actual de la especificación de mon
      # Mismo razonamiento que con mgr: 'cephadm bootstrap' ya deja una spec de
      # mon con el nodo de bootstrap desde el principio, así que hay que
      # comparar placement actual vs. deseado, no solo "existe o no".
      ansible.builtin.command: ceph orch ls --service-name mon --format json
      register: mon_spec_check
      changed_when: false

    - name: Aplicar 3 monitores repartidos en los nodos de control dedicados (mon+mgr)
      ansible.builtin.command: >
        ceph orch apply mon --placement="{{ groups['ceph_control'] | join(',') }}"
      changed_when: >-
        (mon_spec_check.stdout | from_json | first).placement.hosts | default([]) | sort
        != groups['ceph_control'] | sort

    - name: Esperar a que los 3 monitores estén en quorum
      ansible.builtin.command: ceph quorum_status -f json
      register: mon_quorum
      until: (mon_quorum.stdout | from_json).quorum_names | length >= 3
      retries: 30
      delay: 10
      changed_when: false

    - name: Comprobar si ya existe la especificación osd.all-available-devices
      # 'ceph orch apply osd --all-available-devices' es en sí mismo idempotente
      # (no crea OSDs duplicados en discos ya usados), pero siempre devuelve
      # rc=0 con un mensaje de "Scheduled" tanto si crea la especificación por
      # primera vez como si ya existía; sin esta comprobación previa, Ansible
      # marcaría la tarea siguiente como "changed" en todas las reejecuciones.
      ansible.builtin.command: ceph orch ls --service-name osd.all-available-devices --format json
      register: osd_spec_check
      changed_when: false
      failed_when: false

    - name: Activar escaneo de dispositivos y creación automática de OSDs en discos vacíos (/dev/vdb)
      ansible.builtin.command: ceph orch apply osd --all-available-devices
      # 'No services reported' es la salida exacta de 'ceph orch ls' cuando la
      # especificación aún no existe (comando anterior); solo en ese caso esta
      # tarea provoca un cambio real de estado en el clúster Ceph.
      changed_when: "'No services reported' in osd_spec_check.stdout"

    - name: Esperar a que se aprovisionen los OSDs (mínimo 3 OSDs listos)
      ansible.builtin.command: ceph osd stat -f json
      register: osd_stat
      until: (osd_stat.stdout | from_json).num_up_osds >= 3 and (osd_stat.stdout | from_json).num_in_osds >= 3
      retries: 30
      delay: 10
      changed_when: false

    - name: Mostrar estado de salud del clúster Ceph Externo
      ansible.builtin.command: ceph health
      register: ceph_health
      changed_when: false

    - name: Averiguar qué nodo aloja el mgr activo ahora mismo (para dar una URL real, no genérica)
      ansible.builtin.command: ceph mgr dump -f json
      register: mgr_dump
      changed_when: false

    - name: Resolver la IP del nodo con el mgr activo
      ansible.builtin.set_fact:
        # 'active_name' viene como '<hostname>.<random>' (ej. 'ceph-mgr2.abcde');
        # se recorta al primer segmento para poder buscarlo en hostvars.
        active_mgr_host: "{{ (mgr_dump.stdout | from_json).active_name.split('.')[0] }}"

    - name: Mostrar datos del clúster
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "  ¡CLÚSTER CEPH EXTERNO BOOTSTRAPEADO CON ÉXITO!"
          - "  "
          - "  Nodo de bootstrap: {{ ansible_host }}"
          - "  Estado de Salud: {{ ceph_health.stdout }}"
          - "  Nodos OSD integrados: {{ groups['ceph_osds'] | join(', ') }}"
          - "  Nodos de control (mon+mgr, 3 en HA): {{ groups['ceph_control'] | join(', ') }}"
          - "  "
          - "  Ceph Dashboard (mgr activo ahora mismo, {{ active_mgr_host }}):"
          - "    https://{{ hostvars[active_mgr_host].ansible_host }}:8443 (certificado autofirmado)"
          - "  Si ese nodo cae, el mgr standby toma el relevo automáticamente en otra IP"
          - "  de este mismo grupo — vuelve a mirar 'ceph mgr dump' o usa cualquiera de:"
          - "  {{ groups['ceph_control'] | map('extract', hostvars, 'ansible_host') | map('regex_replace', '^(.*)$', 'https://\\1:8443') | join(' , ') }}"
          - "  Usuario: admin"
          - "  Contraseña guardada de forma segura en: {{ playbook_dir }}/ceph_dashboard_password.txt"
          - "════════════════════════════════════════════════════════════════"
