---
- name: Obtener credenciales y datos del Clúster Ceph Externo
  hosts: ceph_control_bootstrap
  become: true
  gather_facts: false
  tasks:
    - name: Crear el pool RBD para los volúmenes de Kubernetes
      # size se fija explícitamente en vez de heredar osd_pool_default_size
      # del clúster (3 por defecto): así queda auto-documentado el nivel de
      # réplica que este laboratorio espera, en vez de depender de un valor
      # implícito. min_size NO admite 'ceph osd pool create --min-size' (el
      # comando solo acepta 'size' como argumento posicional; --min-size da
      # "Unexpected argument"), así que se fija aparte con 'pool set' justo
      # debajo.
      ansible.builtin.command: ceph osd pool create rbd-k8s --size 3
      register: rbd_pool_create
      failed_when:
        - rbd_pool_create.rc != 0
        - "'already exists' not in rbd_pool_create.stderr"
      changed_when: "'created pool' in rbd_pool_create.stdout"

    - name: Comprobar el min_size actual del pool rbd-k8s
      # 'ceph osd pool set min_size' siempre devuelve rc=0 con "set pool ...
      # min_size to N" tanto si cambia el valor como si ya estaba en N; sin
      # esta comprobación previa, Ansible marcaría la tarea siguiente como
      # "changed" en todas las reejecuciones.
      ansible.builtin.command: ceph osd pool get rbd-k8s min_size -f json
      register: rbd_pool_min_size_check
      changed_when: false

    - name: Fijar min_size explícitamente en el pool rbd-k8s
      ansible.builtin.command: ceph osd pool set rbd-k8s min_size 2
      changed_when: "(rbd_pool_min_size_check.stdout | from_json).min_size != 2"

    - name: Comprobar el número de réplicas configurado en el pool rbd-k8s
      ansible.builtin.command: ceph osd pool get rbd-k8s size -f json
      register: rbd_pool_size
      changed_when: false

    - name: Verificar que el número de OSDs disponibles soporta el nivel de réplica configurado
      ansible.builtin.assert:
        that:
          - (rbd_pool_size.stdout | from_json).size <= (groups['ceph_osds'] | length)
        fail_msg: >-
          El pool rbd-k8s pide {{ (rbd_pool_size.stdout | from_json).size }} réplicas pero solo
          hay {{ groups['ceph_osds'] | length }} nodos OSD — con el dominio de fallo por
          defecto (host), Ceph nunca podrá colocar todas las réplicas y el pool quedará
          degradado (HEALTH_WARN) de forma permanente.

    - name: Inicializar el pool como pool de aplicación RBD
      ansible.builtin.command: rbd pool init rbd-k8s
      changed_when: false

    - name: Obtener FSID del clúster Ceph
      ansible.builtin.command: ceph fsid
      register: ceph_fsid_raw
      changed_when: false

    - name: Obtener clave de client.admin
      ansible.builtin.command: ceph auth get-key client.admin
      register: ceph_admin_key_raw
      changed_when: false

    - name: Registrar variables en el monitor
      ansible.builtin.set_fact:
        ceph_fsid: "{{ ceph_fsid_raw.stdout | trim }}"
        ceph_admin_key: "{{ ceph_admin_key_raw.stdout | trim }}"

- name: Integrar Ceph Externo en Kubernetes con Ceph CSI Drivers
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubeconfig_path: "{{ playbook_dir }}/kubeconfig.yaml"
    # IPs de los 3 nodos de control (mon+mgr en HA); se usan todas en el mapa
    # 'monitors' de abajo para que el driver CSI pueda seguir resolviendo el
    # clúster Ceph aunque caiga cualquiera de los 3 mon.
    ceph_mon_ips: "{{ groups['ceph_control'] | map('extract', hostvars, 'ansible_host') | list }}"
    ceph_fsid: "{{ hostvars[groups['ceph_control_bootstrap'][0]]['ceph_fsid'] }}"
    ceph_admin_key: "{{ hostvars[groups['ceph_control_bootstrap'][0]]['ceph_admin_key'] }}"
  tasks:
    - name: Crear namespace de almacenamiento ceph-csi
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ceph-csi

    - name: Crear secreto de conexión de Ceph (csi-ceph-secret) en ceph-csi
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: csi-ceph-secret
            namespace: ceph-csi
          stringData:
            userID: admin
            # userKey: clave que usa el driver CSI para las operaciones normales
            # (crear/montar/expandir volúmenes RBD) autenticado como 'admin'.
            userKey: "{{ ceph_admin_key }}"
            # admin: mismo valor que userKey, pero bajo la clave que espera
            # concretamente la operación de expansión de volumen (resize) del
            # driver Ceph CSI; el chart la busca con este nombre fijo aparte
            # de userKey, así que hay que duplicar el mismo secreto con ambas
            # claves aunque el valor sea idéntico.
            admin: "{{ ceph_admin_key }}"

    - name: Agregar el repositorio de Ceph CSI a Helm
      kubernetes.core.helm_repository:
        name: ceph-csi-operator
        repo_url: https://ceph.github.io/ceph-csi-operator
        force_update: true

    - name: Instalar el operador de Ceph CSI (CRDs y controlador)
      kubernetes.core.helm:
        name: ceph-csi-operator
        chart_ref: ceph-csi-operator/ceph-csi-operator
        chart_version: "{{ ceph_csi_chart_version }}"
        release_namespace: ceph-csi
        create_namespace: true
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Esperar a que las CRDs de Ceph CSI estén disponibles
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }} get crd drivers.csi.ceph.io
      register: crd_check
      until: crd_check.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Instalar los controladores de Ceph CSI en Kubernetes
      kubernetes.core.helm:
        name: ceph-csi-drivers
        chart_ref: ceph-csi-operator/ceph-csi-drivers
        chart_version: "{{ ceph_csi_chart_version }}"
        release_namespace: ceph-csi
        kubeconfig: "{{ kubeconfig_path }}"
        values:
          # Configurar la conexión al Ceph externo vía las CRDs CephConnection/ClientProfile
          # (el chart ceph-csi-operator/ceph-csi-drivers ya no usa un ConfigMap plano).
          cephConnections:
            # El nombre de la CephConnection se fija al FSID real del clúster
            # Ceph (no a un alias arbitrario tipo "ceph-externo"): es el mismo
            # valor que luego se referencia como 'clusterID' en la StorageClass
            # de abajo, y es como el driver CSI localiza a qué clúster Ceph
            # pertenece cada volumen.
            - name: "{{ ceph_fsid }}"
              # Las claves ('mon-a', 'mon-b', ...) son solo etiquetas internas
              # arbitrarias para identificar cada entrada dentro del mapa de
              # monitores; no tienen que coincidir con el nombre real de cada
              # daemon mon en Ceph. Lo que importa es el valor: host:puerto de
              # cada monitor real. Se listan los 3 nodos de ceph_control (mon
              # en HA) para que el driver CSI conserve conectividad aunque
              # caiga cualquiera de los 3 — con un solo monitor en la lista,
              # la HA de mon del lado de Ceph no serviría de nada del lado K8s.
              monitors: "{{ dict(['mon-a', 'mon-b', 'mon-c'] | zip(ceph_mon_ips | map('regex_replace', '$', ':6789'))) }}"
              # rbdMirrorDaemonCount controla cuántas réplicas del daemon de
              # rbd-mirror despliega el operador para esta conexión; se deja
              # en 1 porque este laboratorio no configura replicación RBD
              # entre clústeres Ceph, solo necesita que el recurso exista.
              rbdMirrorDaemonCount: 1
          clientProfiles:
            # El ClientProfile también se nombra con el FSID para que coincida
            # con el 'clusterID' que la StorageClass usa al pedir un volumen;
            # es la referencia que enlaza ambas CRDs entre sí.
            - name: "{{ ceph_fsid }}"
              cephConnection:
                name: "{{ ceph_fsid }}"
        server_side: true
        force_conflicts: true

    - name: Crear StorageClass para volúmenes RBD de Ceph Externo
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: ceph-block-external
            annotations:
              # Única StorageClass de este laboratorio (no convive con otra
              # como en el lab 04 con rook-ceph/ceph-filesystem), así que se
              # marca como predeterminada para que cualquier PVC sin
              # storageClassName explícito la use automáticamente.
              storageclass.kubernetes.io/is-default-class: "true"
          provisioner: rbd.csi.ceph.com
          # Delete borra el volumen RBD subyacente al borrar el PVC; válido
          # para un laboratorio, no recomendable en producción (ahí se
          # preferiría 'Retain' para no perder datos por accidente).
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            # clusterID debe coincidir exactamente con el 'name' del
            # CephConnection/ClientProfile de arriba (el FSID real de Ceph):
            # es como el driver CSI resuelve, a partir de este ID, a qué
            # monitores y credenciales conectarse para aprovisionar el volumen.
            clusterID: "{{ ceph_fsid }}"
            pool: rbd-k8s
            # Formato de imagen RBD v2, requerido por 'imageFeatures: layering'.
            imageFormat: "2"
            imageFeatures: layering
            # Mismo secreto (csi-ceph-secret) reutilizado para las tres fases
            # del ciclo de vida del volumen (aprovisionar, expandir, montar en
            # el nodo); el driver CSI de Ceph exige declarar cada una por
            # separado aunque apunten todas al mismo Secret.
            csi.storage.k8s.io/provisioner-secret-name: csi-ceph-secret
            csi.storage.k8s.io/provisioner-secret-namespace: ceph-csi
            csi.storage.k8s.io/controller-expand-secret-name: csi-ceph-secret
            csi.storage.k8s.io/controller-expand-secret-namespace: ceph-csi
            csi.storage.k8s.io/node-stage-secret-name: csi-ceph-secret
            csi.storage.k8s.io/node-stage-secret-namespace: ceph-csi
            # ext4 es el filesystem con el que el driver CSI formatea cada
            # volumen RBD nuevo antes de montarlo en el pod.
            csi.storage.k8s.io/fstype: ext4

    - name: Mostrar resumen de integración
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "  ¡CEPH EXTERNO INTEGRADO CON ÉXITO EN KUBERNETES!"
          - "  "
          - "  FSID de Ceph: {{ ceph_fsid }}"
          - "  Monitores (HA, 3): {{ ceph_mon_ips | map('regex_replace', '^(.*)$', '\\1:6789') | join(' , ') }}"
          - "  StorageClass creada: 'ceph-block-external' (RBD / RWO) [Defecto]"
          - "════════════════════════════════════════════════════════════════"
