---
- name: Verificar Almacenamiento Persistente RBD y CephFS con Rook
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubeconfig_path: "{{ playbook_dir }}/kubeconfig.yaml"
  tasks:
    - name: Crear namespace de prueba para persistencia Ceph
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: test-ceph-persistence

    # 1. PRUEBA RBD (ReadWriteOnce - RWO)
    - name: Crear PVC para RBD (ceph-block)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: rbd-pvc-rwo
            namespace: test-ceph-persistence
          spec:
            # ReadWriteOnce: un volumen RBD solo puede montarse de lectura-
            # escritura en un único nodo a la vez; es la prueba de la
            # StorageClass 'ceph-block' (backend RBD), pensada para un solo
            # pod/réplica (bases de datos, discos exclusivos, etc.).
            accessModes:
              - ReadWriteOnce
            storageClassName: ceph-block
            resources:
              requests:
                storage: "{{ rook_ceph_test_pvc_size }}"

    - name: Esperar a que el PVC de RBD esté Bound
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }} get pvc rbd-pvc-rwo -n test-ceph-persistence -o jsonpath='{.status.phase}'
      register: rbd_pvc_status
      # 'Bound' confirma que el aprovisionador CSI de RBD ya creó la imagen
      # Ceph y la enlazó al PVC; sin este PV no existe aún y el Pod que lo
      # monte se quedaría en Pending.
      until: rbd_pvc_status.stdout == 'Bound'
      retries: 30
      delay: 5
      changed_when: false

    - name: Crear Pod escritor para probar RBD (RWO)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: rbd-writer-pod
            namespace: test-ceph-persistence
          spec:
            containers:
              - name: writer
                image: "{{ test_alpine_image }}"
                command: ["/bin/sh", "-c"]
                args:
                  # Escribe una vez al arrancar y luego 'sleep 3600' mantiene
                  # el contenedor vivo el tiempo suficiente para poder hacer
                  # 'kubectl exec' y leer el fichero antes de que termine.
                  - >
                    echo "Hola desde RBD en el pod rbd-writer-pod" > /mnt/rbd-data/rbd-log.txt;
                    sleep 3600
                volumeMounts:
                  - name: rbd-vol
                    mountPath: /mnt/rbd-data
            volumes:
              - name: rbd-vol
                persistentVolumeClaim:
                  claimName: rbd-pvc-rwo

    - name: Esperar a que el Pod escritor de RBD esté en ejecución
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }} get pod rbd-writer-pod -n test-ceph-persistence -o jsonpath='{.status.phase}'
      register: pod_status
      until: pod_status.stdout == 'Running'
      retries: 30
      delay: 5
      changed_when: false

    - name: Verificar lectura del archivo en RBD
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }} exec -n test-ceph-persistence rbd-writer-pod -- cat /mnt/rbd-data/rbd-log.txt
      register: rbd_file_content
      # Esta es la prueba real: si el 'exec' puede leer el mismo contenido
      # que se escribió al arrancar el Pod, el volumen RBD persiste los datos
      # correctamente (no es un tmpfs/emptyDir efímero).
      changed_when: false

    # 2. PRUEBA CephFS (ReadWriteMany - RWX)
    - name: Crear PVC para CephFS (ceph-filesystem)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: cephfs-pvc-rwx
            namespace: test-ceph-persistence
          spec:
            # ReadWriteMany: a diferencia de RBD, CephFS sí permite montar el
            # mismo volumen de lectura-escritura en varios nodos/pods a la
            # vez; es justo lo que se prueba abajo con 2 réplicas compartiendo
            # el mismo PVC.
            accessModes:
              - ReadWriteMany
            storageClassName: ceph-filesystem
            resources:
              requests:
                storage: "{{ rook_ceph_test_pvc_size }}"

    - name: Esperar a que el PVC de CephFS esté Bound
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }} get pvc cephfs-pvc-rwx -n test-ceph-persistence -o jsonpath='{.status.phase}'
      register: cephfs_pvc_status
      until: cephfs_pvc_status.stdout == 'Bound'
      retries: 30
      delay: 5
      changed_when: false

    - name: Crear Deployment de prueba (2 réplicas) compartiendo CephFS (RWX)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: cephfs-rwx-writer
            namespace: test-ceph-persistence
          spec:
            # 2 réplicas montando el mismo PVC RWX simultáneamente: es la
            # parte de la prueba que RBD no podría soportar (ReadWriteOnce
            # solo admite un montador a la vez); con CephFS ambos pods
            # escriben al mismo fichero sin conflicto.
            replicas: 2
            selector:
              matchLabels:
                app: cephfs-writer
            template:
              metadata:
                labels:
                  app: cephfs-writer
              spec:
                containers:
                  - name: writer
                    image: "{{ test_alpine_image }}"
                    command: ["/bin/sh", "-c"]
                    args:
                      # Bucle infinito en vez de una escritura única: cada
                      # réplica añade su propia línea (identificada por su
                      # ${HOSTNAME}) al mismo fichero compartido, para poder
                      # comprobar después que las escrituras de ambos pods
                      # conviven en el mismo archivo sin pisarse.
                      - >
                        while true; do
                          echo "$(date): Hola compartiendo datos desde ${HOSTNAME}" >> /mnt/shared-cephfs/logs.txt;
                          sleep 5;
                        done
                    volumeMounts:
                      - name: cephfs-vol
                        mountPath: /mnt/shared-cephfs
                volumes:
                  - name: cephfs-vol
                    persistentVolumeClaim:
                      claimName: cephfs-pvc-rwx

    - name: Esperar a que el deployment de CephFS esté completamente listo
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }} rollout status deployment/cephfs-rwx-writer -n test-ceph-persistence --timeout=300s
      changed_when: false

    - name: Pausar 12 segundos para permitir que los pods escriban en CephFS
      # El bucle de arriba escribe cada 5s; con 12s de margen nos aseguramos
      # de que ambas réplicas ya hayan escrito al menos una línea cada una
      # antes de comprobar el fichero compartido.
      ansible.builtin.pause:
        seconds: 12

    - name: Obtener el nombre de uno de los pods escritores de CephFS
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }} get pods -n test-ceph-persistence -l app=cephfs-writer -o jsonpath='{.items[0].metadata.name}'
      register: cephfs_pod_name
      # Da igual desde qué réplica se lea: al ser RWX, el fichero es el mismo
      # para las dos, así que basta con hacer 'exec' en cualquiera de los pods
      # del Deployment (el primero que devuelva el selector).
      changed_when: false

    - name: Comprobar el contenido del archivo de logs compartido en CephFS
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }} exec -n test-ceph-persistence {{ cephfs_pod_name.stdout }} -- cat /mnt/shared-cephfs/logs.txt
      register: cephfs_file_content
      # Si aparecen líneas de ambos ${HOSTNAME} (los dos pods) en el mismo
      # fichero, queda demostrado que el volumen es realmente compartido
      # (RWX) y no uno distinto por pod.
      changed_when: false

    - name: Mostrar resultados de verificación
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "  ¡VERIFICACIÓN DE ALMACENAMIENTO ROOK CEPH EXITOSA!"
          - "  "
          - "  1) Lectura de volumen RBD (RWO):"
          - "     Contenido: '{{ rbd_file_content.stdout }}'"
          - "  "
          - "  2) Lectura de volumen CephFS (RWX) compartido:"
          - "     Líneas de log leídas:"
          - "{{ cephfs_file_content.stdout_lines }}"
          - "════════════════════════════════════════════════════════════════"
