---
- name: Desplegar Prometheus y conectarlo al Ceph Dashboard
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubeconfig_path: "{{ playbook_dir }}/kubeconfig.yaml"
  tasks:
    - name: Desplegar el pod toolbox de Rook Ceph (cliente ceph con credenciales admin)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: rook-ceph-tools
            namespace: rook-ceph
            labels:
              app: rook-ceph-tools
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: rook-ceph-tools
            template:
              metadata:
                labels:
                  app: rook-ceph-tools
              spec:
                # El toolbox no trae por sí solo credenciales ni endpoints de
                # los monitores: este initContainer genera /etc/ceph/ceph.conf
                # y /etc/ceph/keyring a partir de los Secrets/ConfigMaps que
                # el propio operador de Rook mantiene actualizados, antes de
                # que arranque el contenedor principal.
                initContainers:
                  - name: generar-ceph-conf
                    image: "{{ ceph_image }}"
                    command: ["/bin/bash", "-c"]
                    args:
                      - |
                        set -e
                        cat > /etc/ceph/ceph.conf <<CONF
                        [global]
                        mon_host = $(echo "$ROOK_MON_ENDPOINTS" | sed 's/[a-z]=//g')
                        CONF
                        cat > /etc/ceph/keyring <<KEYRING
                        [client.admin]
                        key = $ROOK_CEPH_SECRET
                        KEYRING
                    env:
                      # Secret gestionado por Rook con la clave admin del
                      # clúster Ceph (equivalente a /etc/ceph/keyring en un
                      # despliegue Ceph tradicional).
                      - name: ROOK_CEPH_SECRET
                        valueFrom:
                          secretKeyRef:
                            name: rook-ceph-mon
                            key: ceph-secret
                      # ConfigMap con la lista de monitores vigente (formato
                      # 'a=ip:puerto,b=ip:puerto,...'); el 'sed' de arriba
                      # quita las letras de identificación de cada mon para
                      # dejar solo la lista de endpoints que espera mon_host.
                      - name: ROOK_MON_ENDPOINTS
                        valueFrom:
                          configMapKeyRef:
                            name: rook-ceph-mon-endpoints
                            key: data
                    volumeMounts:
                      - name: ceph-config
                        mountPath: /etc/ceph
                containers:
                  - name: rook-ceph-tools
                    image: "{{ ceph_image }}"
                    # El contenedor no ejecuta ningún demonio Ceph: solo se
                    # mantiene vivo para poder hacer 'kubectl exec ... -- ceph ...'
                    # con el cliente 'ceph' ya configurado por el initContainer.
                    command: ["/bin/bash", "-c", "sleep infinity"]
                    volumeMounts:
                      - name: ceph-config
                        mountPath: /etc/ceph
                volumes:
                  # emptyDir compartido entre el initContainer y el contenedor
                  # principal: solo necesita sobrevivir mientras vive el pod,
                  # no aporta persistencia real (el propio toolbox no guarda
                  # estado).
                  - name: ceph-config
                    emptyDir: {}

    - name: Esperar a que el toolbox de Ceph esté listo
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }} -n rook-ceph rollout status deployment/rook-ceph-tools --timeout=90s
      changed_when: false

    - name: Agregar el repositorio de Prometheus Community a Helm
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts
        force_update: true

    - name: Instalar o actualizar Prometheus usando Helm (mínimo, sin Alertmanager/Grafana)
      kubernetes.core.helm:
        name: prometheus
        chart_ref: prometheus-community/prometheus
        chart_version: "{{ prometheus_chart_version }}"
        release_namespace: monitoring
        create_namespace: true
        kubeconfig: "{{ kubeconfig_path }}"
        values:
          # Se desactivan los componentes que no hacen falta para este
          # laboratorio (solo se quiere el server de Prometheus scrapeando
          # métricas de Ceph, no alertas ni un pushgateway).
          alertmanager:
            enabled: false
          prometheus-pushgateway:
            enabled: false
          server:
            # Sin PVC: los datos de Prometheus quedan en almacenamiento
            # efímero del pod: válido para un laboratorio de solo lectura de
            # métricas, pero se pierde el histórico si el pod se reprograma.
            persistentVolume:
              enabled: false
          # Añade el exporter de métricas del propio Ceph mgr (puerto 9283,
          # habilitado por el módulo 'prometheus' de Ceph que Rook activa por
          # defecto) como scrape target adicional a los que ya trae el chart.
          extraScrapeConfigs: |
            - job_name: 'rook-ceph-mgr'
              # honor_labels evita que Prometheus sobrescriba las labels que
              # ya trae cada métrica exportada por Ceph con las suyas propias
              # (p.ej. 'instance'), conservando las originales del exporter.
              honor_labels: true
              static_configs:
                - targets: ['rook-ceph-mgr.rook-ceph.svc.cluster.local:9283']

    - name: Esperar a que Prometheus esté listo
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }} -n monitoring rollout status deployment/prometheus-server --timeout=180s
      changed_when: false

    - name: Configurar en el Ceph Dashboard la URL de la API de Prometheus (host y puerto incluidos)
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }} -n rook-ceph exec deploy/rook-ceph-tools --
        ceph dashboard set-prometheus-api-host http://prometheus-server.monitoring.svc.cluster.local:80
      changed_when: true

    - name: Mostrar datos de éxito
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "  ¡PROMETHEUS DESPLEGADO Y CONECTADO AL CEPH DASHBOARD!"
          - "  "
          - "  Namespace: monitoring"
          - "  Scrape target: rook-ceph-mgr.rook-ceph.svc.cluster.local:9283"
          - "  "
          - "  El pod 'rook-ceph-tools' en el namespace rook-ceph queda desplegado"
          - "  de forma permanente para poder ejecutar comandos 'ceph' manualmente:"
          - "  kubectl --kubeconfig=kubeconfig.yaml -n rook-ceph exec -it deploy/rook-ceph-tools -- ceph -s"
          - "════════════════════════════════════════════════════════════════"
