---
# Lab 11 — NGINX Inc Ingress Controller (nginxinc/kubernetes-ingress).
#
# 1. Instala el controlador NGINX Ingress oficial de NGINX Inc / F5 (chart nginx-stable/nginx-ingress).
# 2. Despliega aplicaciones backend de prueba ('web-app' y 'api-app').
# 3. Genera e inyecta un Secret TLS con certificados SSL/TLS para el dominio 'nginx.example.com'.
# 4. Aplica un recurso Ingress declarativo (ingressClassName: nginx) demostrando:
#    - Filtrado por URL / Host ('nginx.example.com').
#    - Filtrado por Ruta ('/web' -> web-app:8080 y '/api' -> api-app:8080).
#    - Filtrado por Puerto y terminación TLS en puerto 443 (NodePort HTTPS 30443 / NodePort HTTP 30080).
# 5. Comprueba en vivo el encaminamiento SSL/TLS en el puerto 30443 y el filtrado por ruta.
#
# Idempotente: re-ejecutar este playbook sobre un clúster existente mantiene los recursos sin cambios (changed=0).

- name: Install and Verify NGINX Inc Ingress Controller (nginxinc/kubernetes-ingress)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  vars:
    local_kubeconfig: "{{ lookup('env', 'PWD') }}/kubeconfig.yaml"
    test_namespace: ingress-nginx-demo
    ingress_domain: "nginx.example.com"
  tasks:
    - name: Ensure demo namespace exists
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ test_namespace }}"

    - name: Add Helm repository for NGINX Inc (nginxinc/kubernetes-ingress)
      kubernetes.core.helm_repository:
        name: nginx-stable
        repo_url: https://helm.nginx.com/stable

    - name: Install NGINX Inc Ingress Controller via Helm
      kubernetes.core.helm:
        name: nginx-ingress
        chart_ref: nginx-stable/nginx-ingress
        release_namespace: "{{ test_namespace }}"
        create_namespace: false
        kubeconfig: "{{ local_kubeconfig }}"
        wait: true
        values:
          controller:
            ingressClass:
              name: nginx
              setAsDefaultIngressClass: false
            service:
              type: NodePort
              externalTrafficPolicy: Cluster
              httpPort:
                nodePort: 30080
              httpsPort:
                nodePort: 30443

    # ── Despliegue de Backend Applications ───────────────────────────────────
    - name: Deploy web-app backend Pod
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: web-app
            namespace: "{{ test_namespace }}"
            labels:
              app: web-app
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: web-app
            template:
              metadata:
                labels:
                  app: web-app
              spec:
                containers:
                  - name: web
                    image: busybox:1.36
                    command:
                      - sh
                      - -c
                      - 'while true; do echo -e "HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\nContent-Length: 32\r\n\r\nResponse from NGINX Inc Web App!" | nc -ll -p 8080; done'
                    ports:
                      - containerPort: 8080

    - name: Deploy web-app Service
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: web-app-svc
            namespace: "{{ test_namespace }}"
          spec:
            selector:
              app: web-app
            ports:
              - port: 8080
                targetPort: 8080

    - name: Deploy api-app backend Pod
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: api-app
            namespace: "{{ test_namespace }}"
            labels:
              app: api-app
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: api-app
            template:
              metadata:
                labels:
                  app: api-app
              spec:
                containers:
                  - name: api
                    image: busybox:1.36
                    command:
                      - sh
                      - -c
                      - 'while true; do echo -e "HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\nContent-Length: 32\r\n\r\nResponse from NGINX Inc API App!" | nc -ll -p 8080; done'
                    ports:
                      - containerPort: 8080

    - name: Deploy api-app Service
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: api-app-svc
            namespace: "{{ test_namespace }}"
          spec:
            selector:
              app: api-app
            ports:
              - port: 8080
                targetPort: 8080

    # ── Certificados SSL/TLS para Ingress NGINX Inc ──────────────────────────
    - name: Generate self-signed TLS key and cert for nginx.example.com
      ansible.builtin.command: >-
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /tmp/nginx-tls.key -out /tmp/nginx-tls.crt
        -subj "/CN={{ ingress_domain }}/O=NginxIncDemo"
      args:
        creates: /tmp/nginx-tls.crt

    - name: Read TLS key content
      ansible.builtin.slurp:
        src: /tmp/nginx-tls.key
      register: tls_key_b64

    - name: Read TLS cert content
      ansible.builtin.slurp:
        src: /tmp/nginx-tls.crt
      register: tls_crt_b64

    - name: Create Kubernetes TLS Secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: nginx-tls-secret
            namespace: "{{ test_namespace }}"
          data:
            tls.key: "{{ tls_key_b64.content }}"
            tls.crt: "{{ tls_crt_b64.content }}"

    # ── Reglas Ingress NGINX Inc: URL, Ruta, Puerto y TLS ────────────────────
    - name: Apply Ingress resource targeting NGINX Inc controller
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: nginx-demo-ingress
            namespace: "{{ test_namespace }}"
            annotations:
              nginx.org/ssl-redirect: "false"
          spec:
            ingressClassName: nginx
            tls:
              - hosts:
                  - "{{ ingress_domain }}"
                secretName: nginx-tls-secret
            rules:
              - host: "{{ ingress_domain }}"
                http:
                  paths:
                    - path: /web
                      pathType: Prefix
                      backend:
                        service:
                          name: web-app-svc
                          port:
                            number: 8080
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: api-app-svc
                          port:
                            number: 8080

    - name: Wait for NGINX Inc controller Pod to reach Running state
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ test_namespace }}"
        label_selectors:
          - app.kubernetes.io/name=nginx-ingress
        kubeconfig: "{{ local_kubeconfig }}"
      register: nginx_controller_pod
      retries: 60
      delay: 5
      until: >
        nginx_controller_pod.resources | default([]) | length > 0 and
        (nginx_controller_pod.resources[0].status.phase | default('')) == 'Running'

    - name: Get node IP hosting NGINX Inc controller Pod
      ansible.builtin.set_fact:
        controller_node_ip: "{{ hostvars[nginx_controller_pod.resources[0].spec.nodeName].ansible_host }}"

    - name: Test Ingress NGINX Inc HTTPS Path routing to /web on NodePort 30443
      ansible.builtin.command: >-
        curl -s -k --resolve {{ ingress_domain }}:30443:{{ controller_node_ip }}
        https://{{ ingress_domain }}:30443/web
      register: web_route_res
      changed_when: false

    - name: Test Ingress NGINX Inc HTTPS Path routing to /api on NodePort 30443
      ansible.builtin.command: >-
        curl -s -k --resolve {{ ingress_domain }}:30443:{{ controller_node_ip }}
        https://{{ ingress_domain }}:30443/api
      register: api_route_res
      changed_when: false

    - name: Assert Ingress NGINX Inc URL, Host, Path and SSL/TLS filtering succeed
      ansible.builtin.assert:
        that:
          - "'Response from NGINX Inc Web App!' in web_route_res.stdout"
          - "'Response from NGINX Inc API App!' in api_route_res.stdout"
        fail_msg: "NGINX Inc Ingress path routing test failed"
        success_msg: "NGINX Inc Ingress URL, Host, Path and SSL/TLS filtering is operational."

    - name: Display NGINX Inc Ingress verification banner
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
            Lab 11: NGINX Inc Ingress Controller (nginxinc/kubernetes-ingress) Verificado!

            Dominio Host: {{ ingress_domain }}
            IP Nodo Controller: {{ controller_node_ip }}
            Puertos NodePort: HTTP 30080 / HTTPS 30443

            ✓ Filtrado por URL / Host ({{ ingress_domain }}): OK
            ✓ Filtrado por Ruta /web  -> web-app-svc:8080 (OK)
            ✓ Filtrado por Ruta /api  -> api-app-svc:8080 (OK)
            ✓ Certificado TLS (Secret nginx-tls-secret en puerto HTTPS 30443): OK
          ════════════════════════════════════════════════════════════════
