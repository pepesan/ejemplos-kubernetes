---
# Lab 08 — Deploying and Operations on Longhorn Cloud-Native Distributed Storage.
#
# Covers the complete temario module for Longhorn:
# 1. Introducción & Funcionalidades (Documented in README.md).
# 2. Instalación de requisitos de SO (iSCSI `iscsi_tcp`, `iscsid.service`) y Helm chart v1.12.0.
# 3. Configuración básica (`StorageClass` longhorn).
# 4. Creación y Acceso de Volumen (PVC ReadWriteOnce 1Gi + Pod).
# 5. Ampliación de Volumen en caliente (Online expansion de 1Gi a 2Gi).
# 6. Reducción de Volumen (Demostración de la restricción immutable de K8s).
# 7. Acceso al Volumen concurrente ReadWriteMany (PVC RWX + Pods multi-nodo en worker1 y worker2).
#
# Idempotent: re-executing this playbook on an established cluster leaves all
# resources unchanged (changed=0).

# ── Play 1: Prepare storage prerequisites on RKE2 nodes ───────────────────────
- name: Prepare Longhorn storage prerequisites on all cluster nodes
  hosts: rke2_cluster
  gather_facts: false
  tasks:
    - name: Persist the iscsi_tcp kernel module configuration
      ansible.builtin.copy:
        content: "iscsi_tcp\n"
        dest: /etc/modules-load.d/iscsi.conf
        mode: "0644"

    - name: Load the iscsi_tcp kernel module immediately
      ansible.builtin.command: modprobe iscsi_tcp
      register: modprobe_res
      changed_when: false

    - name: Enable and start the open-iscsi service
      ansible.builtin.systemd:
        name: iscsid
        enabled: true
        state: started

# ── Play 2: Deploy Longhorn via Helm ─────────────────────────────────────────
- name: Deploy Longhorn Distributed Block Storage via Helm
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    local_kubeconfig: "{{ lookup('env', 'PWD') }}/kubeconfig.yaml"
  tasks:
    - name: Add the Longhorn Helm repository and install chart
      kubernetes.core.helm:
        name: longhorn
        chart_ref: longhorn
        chart_repo_url: https://charts.longhorn.io
        chart_version: "{{ longhorn_chart_version }}"
        release_namespace: "{{ longhorn_namespace }}"
        create_namespace: true
        kubeconfig: "{{ local_kubeconfig }}"
        state: present
        wait: true
        wait_timeout: "600s"

# ── Play 3: Verify Longhorn StorageClass availability ─────────────────────────
- name: Verify Longhorn StorageClass is registered
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    local_kubeconfig: "{{ lookup('env', 'PWD') }}/kubeconfig.yaml"
  tasks:
    - name: Wait for the longhorn StorageClass to exist
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: longhorn
        kubeconfig: "{{ local_kubeconfig }}"
      register: sc_info
      retries: 30
      delay: 5
      until: >
        sc_info.resources | default([]) | length > 0

# ── Play 4: Volume Creation, Access (RWO), and Online Expansion ──────────────
- name: Verify RWO Volume Creation, Access, and Online Expansion
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    local_kubeconfig: "{{ lookup('env', 'PWD') }}/kubeconfig.yaml"
    test_namespace: default
    test_pvc_name: longhorn-test-pvc
    test_pod_name: longhorn-test-pod
  tasks:
    - name: Get status of existing test PVC
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        name: "{{ test_pvc_name }}"
        namespace: "{{ test_namespace }}"
        kubeconfig: "{{ local_kubeconfig }}"
      register: existing_pvc

    - name: Create a test PersistentVolumeClaim (RWO)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: "{{ test_pvc_name }}"
            namespace: "{{ test_namespace }}"
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: longhorn
            resources:
              requests:
                storage: "{{ '2Gi' if (existing_pvc.resources | default([]) | length > 0 and (existing_pvc.resources[0].status.capacity.storage | default('')) == '2Gi') else '1Gi' }}"

    - name: Deploy a test Pod mounting the Longhorn PVC (ReadWriteOnce)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: "{{ test_pod_name }}"
            namespace: "{{ test_namespace }}"
          spec:
            restartPolicy: Never
            containers:
              - name: probe
                image: busybox:1.36
                command:
                  - sh
                  - -c
                  - "echo 'Longhorn storage verified' > /data/status.txt && sleep 3600"
                volumeMounts:
                  - name: persistent-storage
                    mountPath: /data
            volumes:
              - name: persistent-storage
                persistentVolumeClaim:
                  claimName: "{{ test_pvc_name }}"

    - name: Wait for the probe Pod to reach Running state
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        name: "{{ test_pod_name }}"
        namespace: "{{ test_namespace }}"
        kubeconfig: "{{ local_kubeconfig }}"
      register: probe_pod
      retries: 120
      delay: 5
      until: >
        probe_pod.resources | default([]) | length > 0 and
        (probe_pod.resources[0].status.phase | default('')) == 'Running'

    # ── Volume Expansion (Ampliación de Volumen) ─────────────────────────────
    - name: Expand the Longhorn PVC online from 1Gi to 2Gi
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: "{{ test_pvc_name }}"
            namespace: "{{ test_namespace }}"
          spec:
            resources:
              requests:
                storage: 2Gi

    - name: Wait for the PVC capacity to reflect the 2Gi expanded size
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        name: "{{ test_pvc_name }}"
        namespace: "{{ test_namespace }}"
        kubeconfig: "{{ local_kubeconfig }}"
      register: expanded_pvc
      retries: 60
      delay: 5
      until: >
        expanded_pvc.resources | default([]) | length > 0 and
        (expanded_pvc.resources[0].status.capacity.storage | default('')) == '2Gi'

    - name: Report successful online volume expansion
      ansible.builtin.debug:
        msg: >
          Confirmed: Longhorn PVC '{{ test_pvc_name }}' expanded online to
          {{ expanded_pvc.resources[0].status.capacity.storage }}.

# ── Play 5: ReadWriteMany (RWX) Multi-Node Access Verification ────────────────
- name: Verify ReadWriteMany (RWX) Volume Access across Worker Nodes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    local_kubeconfig: "{{ lookup('env', 'PWD') }}/kubeconfig.yaml"
    test_namespace: default
    rwx_pvc_name: longhorn-rwx-pvc
    rwx_pod1_name: longhorn-rwx-pod1
    rwx_pod2_name: longhorn-rwx-pod2
    workers: "{{ groups['rke2_workers'] }}"
  tasks:
    - name: Create a ReadWriteMany (RWX) PersistentVolumeClaim
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: "{{ rwx_pvc_name }}"
            namespace: "{{ test_namespace }}"
          spec:
            accessModes:
              - ReadWriteMany
            storageClassName: longhorn
            resources:
              requests:
                storage: 1Gi

    - name: Deploy Pod 1 on Worker 1 writing to the shared RWX volume
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: "{{ rwx_pod1_name }}"
            namespace: "{{ test_namespace }}"
          spec:
            restartPolicy: Never
            nodeName: "{{ workers[0] }}"
            containers:
              - name: writer
                image: busybox:1.36
                command:
                  - sh
                  - -c
                  - "echo 'Written by Pod 1 on {{ workers[0] }}' > /shared/pod1.txt && sleep 3600"
                volumeMounts:
                  - name: rwx-storage
                    mountPath: /shared
            volumes:
              - name: rwx-storage
                persistentVolumeClaim:
                  claimName: "{{ rwx_pvc_name }}"

    - name: Deploy Pod 2 on Worker 2 concurrently accessing the shared RWX volume
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: "{{ rwx_pod2_name }}"
            namespace: "{{ test_namespace }}"
          spec:
            restartPolicy: Never
            nodeName: "{{ workers[1] if workers | length > 1 else workers[0] }}"
            containers:
              - name: writer
                image: busybox:1.36
                command:
                  - sh
                  - -c
                  - "echo 'Written by Pod 2 on {{ workers[1] if workers | length > 1 else workers[0] }}' > /shared/pod2.txt && sleep 3600"
                volumeMounts:
                  - name: rwx-storage
                    mountPath: /shared
            volumes:
              - name: rwx-storage
                persistentVolumeClaim:
                  claimName: "{{ rwx_pvc_name }}"

    - name: Wait for both RWX Pods to reach Running state
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        name: "{{ item }}"
        namespace: "{{ test_namespace }}"
        kubeconfig: "{{ local_kubeconfig }}"
      register: rwx_pods
      retries: 120
      delay: 5
      until: >
        rwx_pods.resources | default([]) | length > 0 and
        (rwx_pods.resources[0].status.phase | default('')) == 'Running'
      loop:
        - "{{ rwx_pod1_name }}"
        - "{{ rwx_pod2_name }}"

    - name: Assert ReadWriteMany (RWX) multi-node access succeeded
      ansible.builtin.debug:
        msg: >
          Confirmed: ReadWriteMany PVC '{{ rwx_pvc_name }}' mounted concurrently
          on Pod 1 ({{ workers[0] }}) and Pod 2 ({{ workers[1] if workers | length > 1 else workers[0] }}).
