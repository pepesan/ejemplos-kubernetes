---
- name: Configurar Sistema Operativo en los nodos RKE2
  hosts: rke2_cluster
  gather_facts: true
  tasks:
    - name: Deshabilitar unattended-upgrades y timers de APT automáticos
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - unattended-upgrades
        - apt-daily.timer
        - apt-daily-upgrade.timer
      failed_when: false

    - name: Desactivar swap temporalmente
      ansible.builtin.command: swapoff -a
      changed_when: false
      failed_when: false

    - name: Comentar entrada de swap en /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+.*)$'
        replace: '# \1'
      failed_when: false

    - name: Configurar módulos de kernel para RKE2
      ansible.builtin.copy:
        content: |
          overlay
          br_netfilter
        dest: /etc/modules-load.d/rke2.conf
        mode: "0644"

    - name: Cargar módulos de kernel inmediatamente
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter
      failed_when: false

    - name: Configurar parámetros sysctl para RKE2
      ansible.builtin.copy:
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        dest: /etc/sysctl.d/rke2.conf
        mode: "0644"
      register: sysctl_conf

    - name: Aplicar parámetros sysctl
      ansible.builtin.command: sysctl --system
      when: sysctl_conf.changed
      changed_when: true
      failed_when: false

    - name: Instalar paquetes base (curl, open-iscsi, nfs-common)
      ansible.builtin.package:
        name:
          - curl
          - open-iscsi
          - nfs-common
        state: present
