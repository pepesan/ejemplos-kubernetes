---
- name: Configure the operating system on RKE2 nodes
  hosts: rke2_cluster
  gather_facts: true
  tasks:
    - name: Disable unattended-upgrades and automatic APT timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - unattended-upgrades
        - apt-daily.timer
        - apt-daily-upgrade.timer
      failed_when: false

    # No Ansible module for swapoff — command is the correct approach.
    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: false
      failed_when: false

    - name: Comment out the swap entry in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+.*)$'
        replace: '# \1'
      failed_when: false

    - name: Persist kernel modules required by RKE2
      ansible.builtin.copy:
        content: |
          overlay
          br_netfilter
        dest: /etc/modules-load.d/rke2.conf
        mode: "0644"

    - name: Load kernel modules immediately
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter
      failed_when: false

    - name: Set sysctl parameters for RKE2
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/rke2.conf
        reload: true
        state: present
      loop:
        - { key: "net.bridge.bridge-nf-call-iptables",  value: "1" }
        - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
        - { key: "net.ipv4.ip_forward",                 value: "1" }

    - name: Install base packages (curl, open-iscsi, nfs-common)
      ansible.builtin.package:
        name:
          - curl
          - open-iscsi
          - nfs-common
        state: present
