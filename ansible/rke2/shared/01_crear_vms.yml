---
- name: Create/update LXD VMs for the RKE2 cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    lxd_network: "lxdbr0"
    lxd_image: "k8s-template"
  tasks:
    - name: Create/update VM instances in LXD
      community.general.lxd_container:
        name: "{{ item }}"
        type: virtual-machine
        state: started
        source:
          type: image
          alias: "{{ lxd_image }}"
        config:
          limits.cpu: "{{ hostvars[item].lxd_cpu | default('2') | string }}"
          limits.memory: "{{ hostvars[item].lxd_mem | default('4GiB') }}"
        devices:
          eth0:
            type: nic
            network: "{{ lxd_network }}"
            name: eth0
            "ipv4.address": "{{ hostvars[item].ansible_host }}"
          root:
            type: disk
            path: /
            pool: default
            size: "{{ hostvars[item].lxd_disk | default('20GiB') }}"
        wait_for_ipv4_addresses: false
        timeout: 90
      loop: "{{ groups['rke2_cluster'] }}"

    - name: Wait for the LXD agent to answer on each VM
      ansible.builtin.command: 'sg lxd -c "lxc exec {{ item }} -- true"'
      register: lxd_agent_status
      until: lxd_agent_status.rc == 0
      retries: 30
      delay: 2
      loop: "{{ groups['rke2_cluster'] }}"
      changed_when: false

    # SSH bootstrap — chicken-and-egg: we cannot use Ansible modules over SSH
    # because the SSH keys are not yet injected. The LXD agent channel (lxc exec
    # / lxc file push) is the only path available at this stage.
    - name: Set up the .ssh directory on each VM
      ansible.builtin.command: 'sg lxd -c "lxc exec {{ item.0 }} -- {{ item.1 }}"'
      loop: "{{ groups['rke2_cluster'] | product([
        'mkdir -p /root/.ssh',
        'chmod 700 /root/.ssh'
      ]) | list }}"
      loop_control:
        label: "{{ item.0 }} -> {{ item.1 }}"
      changed_when: false

    - name: Inject the host ed25519 public key into each VM
      ansible.builtin.command: 'sg lxd -c "lxc file push ~/.ssh/id_ed25519.pub {{ item }}/root/.ssh/authorized_keys"'
      loop: "{{ groups['rke2_cluster'] }}"
      changed_when: false

    - name: Fix SSH ownership and permissions on each VM
      ansible.builtin.command: 'sg lxd -c "lxc exec {{ item.0 }} -- {{ item.1 }}"'
      loop: "{{ groups['rke2_cluster'] | product([
        'chown -R root:root /root/.ssh',
        'chmod 600 /root/.ssh/authorized_keys'
      ]) | list }}"
      loop_control:
        label: "{{ item.0 }} -> {{ item.1 }}"
      changed_when: false

    - name: Wait for SSH connectivity on port 22
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 22
        delay: 2
        timeout: 60
      loop: "{{ groups['rke2_cluster'] }}"

    - name: Report VMs ready and reachable over SSH
      ansible.builtin.debug:
        msg: "VM {{ item }} ready at IP {{ hostvars[item].ansible_host }}"
      loop: "{{ groups['rke2_cluster'] }}"
