---
- name: Destroy the RKE2 cluster VMs defined in the inventory
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Force-delete the VMs from LXD
      community.general.lxd_container:
        name: "{{ item }}"
        state: absent
        force_stop: true
        type: virtual-machine
      loop: "{{ groups['rke2_cluster'] }}"
      failed_when: false
