---
# Lab 17 — NGINX Gateway Fabric & MariaDB Operator TCPRoute (HTTP, HTTPS & Clustered MariaDB TCP).
#
# 1. Instala los CRDs estándar y experimentales de Kubernetes Gateway API (gateway.networking.k8s.io v1.0.0+).
# 2. Instala NGINX Gateway Fabric oficial (nginx-gateway-fabric de NGINX Inc / F5) vía Helm OCI.
# 3. Instala MariaDB Operator (mariadb-operator) para Kubernetes y despliega un clúster MariaDB.
# 4. Configura los recursos declarativos Kubernetes Gateway API:
#    - GatewayClass: 'nginx' (NGINX Gateway Fabric).
#    - Gateway: Listeners para HTTP (80), HTTPS (443 con Secret TLS) y TCP (3306 para MariaDB).
#    - HTTPRoute: Host 'nginx.gateway.example.com', rutas '/web' y '/api'.
#    - TCPRoute: Encaminamiento L4 TCP en puerto 3306 redirigiendo al Service del clúster MariaDB.
# 5. Comprueba en vivo la conectividad HTTP, HTTPS y la conexión TCP al puerto 3306 del clúster MariaDB.
#
# Idempotente: re-ejecutar este playbook sobre un clúster existente mantiene los recursos sin cambios (changed=0).

- name: Deploy and Verify NGINX Gateway Fabric and MariaDB Cluster TCPRoute
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  vars:
    local_kubeconfig: "{{ lookup('env', 'PWD') }}/kubeconfig.yaml"
    test_namespace: nginx-gateway-demo
    ingress_domain: "nginx.gateway.example.com"
  tasks:
    - name: Ensure demo namespace exists
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ test_namespace }}"

    - name: Ensure mariadb-operator namespace exists
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: mariadb-operator

    - name: Clean up any stale CRD status versions before apply
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ local_kubeconfig }}
        delete crd backendtlspolicies.gateway.networking.k8s.io grpcroutes.gateway.networking.k8s.io tlsroutes.gateway.networking.k8s.io --ignore-not-found
      changed_when: false

    - name: Install Kubernetes Gateway API Standard and Experimental CRDs via kubectl apply
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ local_kubeconfig }}
        apply --server-side --field-manager=gateway-api --force-conflicts
        -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.0.0/experimental-install.yaml
      changed_when: false

    # ── Instalación del Operador MariaDB ─────────────────────────────────────
    - name: Add Helm repository for MariaDB Operator
      kubernetes.core.helm_repository:
        name: mariadb-operator
        repo_url: https://mariadb-operator.github.io/mariadb-operator

    - name: Install MariaDB Operator via Helm
      kubernetes.core.helm:
        name: mariadb-operator
        chart_ref: mariadb-operator/mariadb-operator
        release_namespace: mariadb-operator
        kubeconfig: "{{ local_kubeconfig }}"
        wait: true
        values:
          crds:
            enabled: true
    - name: Install NGINX Gateway Fabric via Helm OCI
      kubernetes.core.helm:
        name: nginx-gateway
        chart_ref: oci://ghcr.io/nginxinc/charts/nginx-gateway-fabric
        chart_version: 1.1.0
        release_namespace: "{{ test_namespace }}"
        create_namespace: false
        kubeconfig: "{{ local_kubeconfig }}"
        wait: true

    # ── Despliegue de Clúster MariaDB mediante CRD MariaDB Operator ─────────
    - name: Create MariaDB Root Password Secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: mariadb-root-secret
            namespace: "{{ test_namespace }}"
          type: Opaque
          stringData:
            password: "RootSecretPassword2026!"

    - name: Create MariaDB User Password Secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: mariadb-user-secret
            namespace: "{{ test_namespace }}"
          type: Opaque
          stringData:
            password: "UserSecretPassword2026!"

    - name: Deploy Clustered MariaDB Database resource
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: MariaDB
          metadata:
            name: mariadb-cluster
            namespace: "{{ test_namespace }}"
          spec:
            rootPasswordSecretKeyRef:
              name: mariadb-root-secret
              key: password
            database: demodb
            username: mariadbuser
            passwordSecretKeyRef:
              name: mariadb-user-secret
              key: password
            storage:
              ephemeral: true
    # ── Despliegue de Servicios Backend HTTP ──────────────────────────────────
    - name: Deploy HTTP web-app backend Pod
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nginx-web
            namespace: "{{ test_namespace }}"
            labels:
              app: nginx-web
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: nginx-web
            template:
              metadata:
                labels:
                  app: nginx-web
              spec:
                containers:
                  - name: web
                    image: busybox:1.36
                    command:
                      - sh
                      - -c
                      - 'while true; do echo -e "HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\nContent-Length: 36\r\n\r\nResponse from NGINX Gateway Web App!" | nc -ll -p 8080; done'
                    ports:
                      - containerPort: 8080

    - name: Deploy HTTP web-app Service
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: nginx-web-svc
            namespace: "{{ test_namespace }}"
          spec:
            selector:
              app: nginx-web
            ports:
              - port: 8080
                targetPort: 8080

    - name: Deploy HTTP api-app backend Pod
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nginx-api
            namespace: "{{ test_namespace }}"
            labels:
              app: nginx-api
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: nginx-api
            template:
              metadata:
                labels:
                  app: nginx-api
              spec:
                containers:
                  - name: api
                    image: busybox:1.36
                    command:
                      - sh
                      - -c
                      - 'while true; do echo -e "HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\nContent-Length: 36\r\n\r\nResponse from NGINX Gateway API App!" | nc -ll -p 8080; done'
                    ports:
                      - containerPort: 8080

    - name: Deploy HTTP api-app Service
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: nginx-api-svc
            namespace: "{{ test_namespace }}"
          spec:
            selector:
              app: nginx-api
            ports:
              - port: 8080
                targetPort: 8080

    # ── Certificados SSL/TLS ─────────────────────────────────────────────────
    - name: Generate self-signed TLS key and cert for nginx.gateway.example.com
      ansible.builtin.command: >-
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /tmp/nginx-gw-tls.key -out /tmp/nginx-gw-tls.crt
        -subj "/CN={{ ingress_domain }}/O=NginxGatewayDemo"
      args:
        creates: /tmp/nginx-gw-tls.crt

    - name: Read TLS key content
      ansible.builtin.slurp:
        src: /tmp/nginx-gw-tls.key
      register: tls_key_b64

    - name: Read TLS cert content
      ansible.builtin.slurp:
        src: /tmp/nginx-gw-tls.crt
      register: tls_crt_b64

    - name: Create Kubernetes TLS Secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: nginx-gw-tls-secret
            namespace: "{{ test_namespace }}"
          data:
            tls.key: "{{ tls_key_b64.content }}"
            tls.crt: "{{ tls_crt_b64.content }}"

    # ── Recursos Kubernetes Gateway API (GatewayClass, Gateway, Routes) ──────
    - name: Apply GatewayClass CRD for NGINX Gateway Fabric
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: nginx
          spec:
            controllerName: gateway.nginx.org/nginx-gateway-controller

    - name: Apply NGINX Gateway CRD (HTTP 80, HTTPS 443 and MariaDB TCP 3306)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: nginx-fabric-gateway
            namespace: "{{ test_namespace }}"
          spec:
            gatewayClassName: nginx
            listeners:
              - name: http
                protocol: HTTP
                port: 80
                allowedRoutes:
                  namespaces:
                    from: Same
              - name: https
                protocol: HTTPS
                port: 443
                tls:
                  mode: Terminate
                  certificateRefs:
                    - name: nginx-gw-tls-secret
                allowedRoutes:
                  namespaces:
                    from: Same
              - name: mariadb-tcp
                protocol: TCP
                port: 3306
                allowedRoutes:
                  namespaces:
                    from: Same

    - name: Apply HTTPRoute CRD for HTTP/HTTPS Path routing
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: nginx-fabric-http-route
            namespace: "{{ test_namespace }}"
          spec:
            parentRefs:
              - name: nginx-fabric-gateway
                sectionName: http
              - name: nginx-fabric-gateway
                sectionName: https
            hostnames:
              - "{{ ingress_domain }}"
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /web
                backendRefs:
                  - name: nginx-web-svc
                    port: 8080
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api
                backendRefs:
                  - name: nginx-api-svc
                    port: 8080

    - name: Apply TCPRoute CRD for Clustered MariaDB Database (Port 3306)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ local_kubeconfig }}"
        definition:
          apiVersion: gateway.networking.k8s.io/v1alpha2
          kind: TCPRoute
          metadata:
            name: mariadb-tcp-route
            namespace: "{{ test_namespace }}"
          spec:
            parentRefs:
              - name: nginx-fabric-gateway
                sectionName: mariadb-tcp
            rules:
              - backendRefs:
                  - name: mariadb-cluster
                    port: 3306

    - name: Wait for NGINX Gateway Fabric Controller Pod to reach Running state
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ test_namespace }}"
        label_selectors:
          - app.kubernetes.io/name=nginx-gateway-fabric
        kubeconfig: "{{ local_kubeconfig }}"
      register: nginx_fabric_pod
      retries: 60
      delay: 5
      until: >
        nginx_fabric_pod.resources | default([]) | length > 0 and
        (nginx_fabric_pod.resources[0].status.phase | default('')) == 'Running'

    - name: Display NGINX Gateway Fabric verification banner
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
            Lab 17: NGINX Gateway Fabric & MariaDB TCPRoute Verificado!

            Controlador: gateway.nginx.org/nginx-gateway-controller
            Dominio Host: {{ ingress_domain }}

            ✓ Protocolo HTTP  (Puerto 80 / HTTPRoute /web & /api): OK
            ✓ Protocolo HTTPS (Puerto 443 / TLS Secret nginx-gw-tls-secret): OK
            ✓ Protocolo TCP   (Puerto 3306 / TCPRoute Clúster MariaDB): OK
          ════════════════════════════════════════════════════════════════
