---
# Lab 03 — Ejemplo 3: CNI Cilium (eBPF Dataplane, Agent Health & L7 Security Capabilities).
#
# Se ejecuta ÚNICAMENTE si rke2_cni es 'cilium' en group_vars/all.yml.
#
# 1. Verifica los componentes nativos de Cilium CNI (cilium DaemonSet y cilium-operator).
# 2. Despliega un servidor HTTP y dos clientes (autorizado y no autorizado).
# 3. Aplica un recurso nativo `CiliumNetworkPolicy` (`cilium.io/v2`) definiendo reglas de filtrado eBPF a nivel L7 HTTP.
# 4. Valida en vivo que el tráfico autorizado es PERMITIDO y el no autorizado es BLOQUEADO por eBPF en el kernel.
#
# Idempotente: re-ejecutar este playbook sobre el clúster existente deja los recursos sin cambios (changed=0).

- name: Verify Cilium CNI eBPF Dataplane and L7 Security Features
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  vars:
    local_kubeconfig: "{{ lookup('env', 'PWD') }}/kubeconfig.yaml"
    test_namespace: default
    primary_server: "{{ groups['rke2_servers'][0] }}"
    workers: "{{ groups['rke2_workers'] }}"
  tasks:
    - name: Check if rke2_cni is set to cilium
      ansible.builtin.debug:
        msg: "Executing Cilium CNI specific test suite (rke2_cni={{ rke2_cni }})"
      when: rke2_cni | default('') == 'cilium'

    - name: Skip Cilium CNI tests if another CNI is configured
      ansible.builtin.debug:
        msg: "Skipping Cilium CNI tests because rke2_cni is set to '{{ rke2_cni }}'"
      when: rke2_cni | default('') != 'cilium'

    - name: Run Cilium CNI verification block
      when: rke2_cni | default('') == 'cilium'
      block:
        - name: Verify Cilium DaemonSet in kube-system
          kubernetes.core.k8s_info:
            api_version: apps/v1
            kind: DaemonSet
            name: cilium
            namespace: kube-system
            kubeconfig: "{{ local_kubeconfig }}"
          register: cilium_ds

        - name: Verify Cilium Operator Deployment in kube-system
          kubernetes.core.k8s_info:
            api_version: apps/v1
            kind: Deployment
            name: cilium-operator
            namespace: kube-system
            kubeconfig: "{{ local_kubeconfig }}"
          register: cilium_op

        - name: Assert Cilium infrastructure is running
          ansible.builtin.assert:
            that:
              - cilium_ds.resources | default([]) | length > 0
              - cilium_op.resources | default([]) | length > 0
            fail_msg: "Cilium CNI DaemonSet or Operator not found in kube-system namespace"
            success_msg: "Cilium CNI eBPF infrastructure is active and running."

        - name: Deploy Cilium HTTP server Pod
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ local_kubeconfig }}"
            definition:
              apiVersion: v1
              kind: Pod
              metadata:
                name: cilium-http-server
                namespace: "{{ test_namespace }}"
                labels:
                  app: cilium-http
              spec:
                restartPolicy: Always
                nodeName: "{{ workers[0] }}"
                containers:
                  - name: http-server
                    image: busybox:1.36
                    command:
                      - sh
                      - -c
                      - 'while true; do echo -e "HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\nContent-Length: 18\r\n\r\nHello from Cilium!" | nc -ll -p 8080; done'

        - name: Deploy Cilium authorized client Pod
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ local_kubeconfig }}"
            definition:
              apiVersion: v1
              kind: Pod
              metadata:
                name: cilium-auth-client
                namespace: "{{ test_namespace }}"
                labels:
                  app: cilium-authorized
              spec:
                restartPolicy: Always
                nodeName: "{{ workers[1] if workers | length > 1 else workers[0] }}"
                containers:
                  - name: client
                    image: busybox:1.36
                    command: ["sleep", "3600"]

        - name: Deploy Cilium unauthorized client Pod
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ local_kubeconfig }}"
            definition:
              apiVersion: v1
              kind: Pod
              metadata:
                name: cilium-unauth-client
                namespace: "{{ test_namespace }}"
                labels:
                  app: cilium-unauthorized
              spec:
                restartPolicy: Always
                nodeName: "{{ workers[1] if workers | length > 1 else workers[0] }}"
                containers:
                  - name: client
                    image: busybox:1.36
                    command: ["sleep", "3600"]

        - name: Wait for Cilium test Pods to reach Running state
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            name: "{{ item }}"
            namespace: "{{ test_namespace }}"
            kubeconfig: "{{ local_kubeconfig }}"
          register: cilium_pods
          retries: 60
          delay: 5
          until: >
            cilium_pods.resources | default([]) | length > 0 and
            (cilium_pods.resources[0].status.phase | default('')) == 'Running'
          loop:
            - cilium-http-server
            - cilium-auth-client
            - cilium-unauth-client

        - name: Obtain Cilium HTTP server Pod IP address
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            name: cilium-http-server
            namespace: "{{ test_namespace }}"
            kubeconfig: "{{ local_kubeconfig }}"
          register: server_pod_info

        - name: Store server_pod_ip fact
          ansible.builtin.set_fact:
            server_pod_ip: "{{ server_pod_info.resources[0].status.podIP }}"

        - name: Apply native CiliumNetworkPolicy L7 specification
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ local_kubeconfig }}"
            definition:
              apiVersion: cilium.io/v2
              kind: CiliumNetworkPolicy
              metadata:
                name: rule-allow-authorized-http
                namespace: "{{ test_namespace }}"
              spec:
                endpointSelector:
                  matchLabels:
                    app: cilium-http
                ingress:
                  - fromEndpoints:
                      - matchLabels:
                          app: cilium-authorized
                    toPorts:
                      - ports:
                          - port: "8080"
                            protocol: TCP
                        rules:
                          http:
                            - method: GET
                              path: "/.*"

        - name: Execute HTTP test from authorized client Pod to Cilium HTTP server
          ansible.builtin.command: >-
            kubectl --kubeconfig {{ local_kubeconfig }}
            exec -n {{ test_namespace }} cilium-auth-client --
            nc -z -w 3 {{ server_pod_ip }} 8080
          register: authorized_traffic
          ignore_errors: true
          changed_when: false

        - name: Assert HTTP traffic from authorized client is PERMITTED
          ansible.builtin.assert:
            that:
              - authorized_traffic.rc == 0
            fail_msg: "HTTP traffic from authorized client failed (rc={{ authorized_traffic.rc }})"
            success_msg: "HTTP traffic from authorized client is PERMITTED by Cilium eBPF."

        - name: Execute HTTP test from unauthorized client Pod to Cilium HTTP server
          ansible.builtin.command: >-
            kubectl --kubeconfig {{ local_kubeconfig }}
            exec -n {{ test_namespace }} cilium-unauth-client --
            nc -z -w 3 {{ server_pod_ip }} 8080
          register: unauthorized_traffic
          ignore_errors: true
          changed_when: false

        - name: Assert HTTP traffic from unauthorized client is BLOCKED by eBPF
          ansible.builtin.assert:
            that:
              - unauthorized_traffic.rc != 0
            fail_msg: "HTTP traffic from unauthorized client was PERMITTED - Cilium eBPF filter failed!"
            success_msg: "HTTP traffic from unauthorized client is BLOCKED by Cilium eBPF as expected."

        - name: Display Cilium CNI eBPF verification banner
          ansible.builtin.debug:
            msg: |
              ════════════════════════════════════════════════════════════════
                Ejemplo 3: CNI Cilium (eBPF Dataplane & L7 Security) Verificado!

                Server Pod IP: {{ server_pod_ip }}:8080

                ✓ Tráfico autorizado (cilium-auth-client -> server:8080): PERMITIDO
                ✓ Tráfico no autorizado (cilium-unauth-client -> server:8080): BLOQUEADO

                Mecánica de Cilium CNI eBPF:
                - Dataplane eBPF: Sustituye iptables por programas eBPF cargados
                  en los hooks de red del kernel Linux (tc, socket maps, XDP).
                - Reemplazo de kube-proxy: Enrutamiento de Services y ClusterIP
                  mediante eBPF hash maps con menor latencia en clústeres grandes.
                - Seguridad L7: Inspecciona cabeceras HTTP y métodos REST mediante
                  reglas nativas CiliumNetworkPolicy en el kernel.
              ════════════════════════════════════════════════════════════════
