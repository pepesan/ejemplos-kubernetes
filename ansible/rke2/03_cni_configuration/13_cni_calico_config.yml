---
# Lab 03 — Ejemplo 4: CNI Calico Nativo (Calico Felix, NetworkPolicies & HelmChartConfig Customization).
#
# Se ejecuta ÚNICAMENTE si rke2_cni es 'calico' en group_vars/all.yml.
#
# 1. Verifica que RKE2 ha desplegado el CNI Calico Nativo (calico-node DaemonSet en calico-system).
# 2. Personaliza declarativamente los parámetros de Calico mediante el CRD `HelmChartConfig` (vethMTU=1450).
# 3. Despliega un pod backend y dos pods clientes (frontend autorizado y rogue no autorizado).
# 4. Aplica una `NetworkPolicy` K8s y verifica en vivo que Calico Felix filtra el tráfico no autorizado en el puerto 8080.
#
# Idempotente: re-ejecutar este playbook sobre el clúster existente deja los recursos sin cambios (changed=0).

- name: Verify Native Calico CNI, Felix Enforcement and HelmChartConfig Customization
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  vars:
    local_kubeconfig: "{{ lookup('env', 'PWD') }}/kubeconfig.yaml"
    test_namespace: default
    primary_server: "{{ groups['rke2_servers'][0] }}"
    workers: "{{ groups['rke2_workers'] }}"
  tasks:
    - name: Check if rke2_cni is set to calico
      ansible.builtin.debug:
        msg: "Executing Calico CNI specific test suite (rke2_cni={{ rke2_cni }})"
      when: rke2_cni | default('') == 'calico'

    - name: Skip Calico CNI tests if another CNI is configured
      ansible.builtin.debug:
        msg: "Skipping Calico CNI tests because rke2_cni is set to '{{ rke2_cni }}'"
      when: rke2_cni | default('') != 'calico'

    - name: Run Calico CNI verification block
      when: rke2_cni | default('') == 'calico'
      block:
        - name: Query Calico DaemonSets in calico-system or kube-system
          kubernetes.core.k8s_info:
            api_version: apps/v1
            kind: DaemonSet
            namespace: calico-system
            kubeconfig: "{{ local_kubeconfig }}"
          register: calico_system_ds

        - name: Identify Calico DaemonSet
          ansible.builtin.set_fact:
            calico_ds_found: >-
              {{
                calico_system_ds.resources | map(attribute='metadata.name') | list |
                select('search', 'calico') | list
              }}

        - name: Assert Calico DaemonSet is active
          ansible.builtin.assert:
            that:
              - calico_ds_found | length > 0
            fail_msg: "Calico DaemonSet (calico-node) not found in calico-system namespace"
            success_msg: "Calico DaemonSet ({{ calico_ds_found | join(', ') }}) is active and running."

        - name: Apply HelmChartConfig for declarative Calico customization
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ local_kubeconfig }}"
            definition:
              apiVersion: helm.cattle.io/v1
              kind: HelmChartConfig
              metadata:
                name: rke2-calico
                namespace: kube-system
              spec:
                valuesContent: |-
                  felix:
                    healthEnabled: true
                    prometheusMetricsEnabled: true
                  vethMTU: 1450

        - name: Verify HelmChartConfig resource status
          kubernetes.core.k8s_info:
            api_version: helm.cattle.io/v1
            kind: HelmChartConfig
            name: rke2-calico
            namespace: kube-system
            kubeconfig: "{{ local_kubeconfig }}"
          register: helm_chart_config_info

        - name: Assert HelmChartConfig rke2-calico exists
          ansible.builtin.assert:
            that:
              - helm_chart_config_info.resources | default([]) | length > 0
            fail_msg: "HelmChartConfig rke2-calico was not found in kube-system"
            success_msg: "HelmChartConfig rke2-calico applied successfully."

        # ── Despliegue de Pods de Prueba Calico ─────────────────────────────────
        - name: Deploy Calico backend server Pod
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ local_kubeconfig }}"
            definition:
              apiVersion: v1
              kind: Pod
              metadata:
                name: calico-backend-pod
                namespace: "{{ test_namespace }}"
                labels:
                  app: calico-backend
              spec:
                restartPolicy: Always
                nodeName: "{{ workers[0] }}"
                containers:
                  - name: server
                    image: busybox:1.36
                    command:
                      - sh
                      - -c
                      - 'while true; do echo -e "HTTP/1.1 200 OK\r\nContent-Length: 18\r\n\r\nHello from Calico" | nc -ll -p 8080; done'

        - name: Deploy Calico authorized frontend client Pod
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ local_kubeconfig }}"
            definition:
              apiVersion: v1
              kind: Pod
              metadata:
                name: calico-frontend-pod
                namespace: "{{ test_namespace }}"
                labels:
                  app: calico-frontend
              spec:
                restartPolicy: Always
                nodeName: "{{ workers[1] if workers | length > 1 else workers[0] }}"
                containers:
                  - name: client
                    image: busybox:1.36
                    command: ["sleep", "3600"]

        - name: Deploy Calico unauthorized rogue client Pod
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ local_kubeconfig }}"
            definition:
              apiVersion: v1
              kind: Pod
              metadata:
                name: calico-rogue-pod
                namespace: "{{ test_namespace }}"
                labels:
                  app: calico-rogue
              spec:
                restartPolicy: Always
                nodeName: "{{ workers[1] if workers | length > 1 else workers[0] }}"
                containers:
                  - name: client
                    image: busybox:1.36
                    command: ["sleep", "3600"]

        - name: Wait for Calico test Pods to reach Running state
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            name: "{{ item }}"
            namespace: "{{ test_namespace }}"
            kubeconfig: "{{ local_kubeconfig }}"
          register: calico_pods
          retries: 60
          delay: 5
          until: >
            calico_pods.resources | default([]) | length > 0 and
            (calico_pods.resources[0].status.phase | default('')) == 'Running'
          loop:
            - calico-backend-pod
            - calico-frontend-pod
            - calico-rogue-pod

        - name: Obtain Calico backend Pod IP address
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            name: calico-backend-pod
            namespace: "{{ test_namespace }}"
            kubeconfig: "{{ local_kubeconfig }}"
          register: calico_backend_info

        - name: Set calico_backend_ip fact
          ansible.builtin.set_fact:
            calico_backend_ip: "{{ calico_backend_info.resources[0].status.podIP }}"

        - name: Apply NetworkPolicy allowing ingress to calico-backend only from app=calico-frontend
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ local_kubeconfig }}"
            definition:
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: allow-calico-frontend-only
                namespace: "{{ test_namespace }}"
              spec:
                podSelector:
                  matchLabels:
                    app: calico-backend
                policyTypes:
                  - Ingress
                ingress:
                  - from:
                      - podSelector:
                          matchLabels:
                            app: calico-frontend
                    ports:
                      - protocol: TCP
                        port: 8080

        - name: Execute traffic test from authorized calico-frontend-pod to backend on port 8080
          ansible.builtin.command: >-
            kubectl --kubeconfig {{ local_kubeconfig }}
            exec -n {{ test_namespace }} calico-frontend-pod --
            nc -z -w 3 {{ calico_backend_ip }} 8080
          register: authorized_traffic
          ignore_errors: true
          changed_when: false

        - name: Assert authorized traffic is PERMITTED
          ansible.builtin.assert:
            that:
              - authorized_traffic.rc == 0
            fail_msg: "Traffic from authorized calico-frontend-pod was BLOCKED (rc={{ authorized_traffic.rc }})"
            success_msg: "Traffic from authorized calico-frontend-pod is PERMITTED as expected."

        - name: Execute traffic test from unauthorized calico-rogue-pod to backend on port 8080
          ansible.builtin.command: >-
            kubectl --kubeconfig {{ local_kubeconfig }}
            exec -n {{ test_namespace }} calico-rogue-pod --
            nc -z -w 3 {{ calico_backend_ip }} 8080
          register: unauthorized_traffic
          ignore_errors: true
          changed_when: false

        - name: Assert unauthorized traffic is BLOCKED
          ansible.builtin.assert:
            that:
              - unauthorized_traffic.rc != 0
            fail_msg: "Traffic from unauthorized calico-rogue-pod was PERMITTED - Calico Felix failed to isolate!"
            success_msg: "Traffic from unauthorized calico-rogue-pod is BLOCKED by Calico Felix as expected."

        - name: Display Calico CNI verification banner
          ansible.builtin.debug:
            msg: |
              ════════════════════════════════════════════════════════════════
                Ejemplo 4: CNI Calico Nativo (Felix & HelmChartConfig) Verificado!

                Backend Pod IP: {{ calico_backend_ip }}:8080
                Calico DaemonSet: {{ calico_ds_found | join(', ') }}

                ✓ Tráfico autorizado (calico-frontend-pod -> backend:8080): PERMITIDO
                ✓ Tráfico no autorizado (calico-rogue-pod -> backend:8080): BLOQUEADO
                ✓ Customización HelmChartConfig (vethMTU=1450, Prometheus metrics=true): OK

                Mecánica de Calico Nativo CNI:
                - Dataplane BGP / VXLAN / IP-in-IP con motor Calico Felix en calico-system.
                - Enrutamiento BGP sin encapsulado posible para redes físicas Enterprise.
                - Filtrado declarativo de alta eficiencia mediante ipsets / iptables en kernel.
              ════════════════════════════════════════════════════════════════
