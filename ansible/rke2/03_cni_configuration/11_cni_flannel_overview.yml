---
# Lab 03 — Ejemplo 2: CNI Flannel (VXLAN Overlay & Policy Enforcement Limitations).
#
# Se ejecuta ÚNICAMENTE si rke2_cni es 'flannel' en group_vars/all.yml.
#
# 1. Verifica que RKE2 ha desplegado el CNI Flannel (DaemonSet kube-flannel-ds).
# 2. Despliega pods receptores y emisores inter-nodo para validar el overlay VXLAN (puerto UDP 8472).
# 3. Aplica una `NetworkPolicy` K8s estándar y demuestra la limitación de diseño de Flannel:
#    al no incluir un motor de políticas (como Calico Felix), las NetworkPolicies son ignoradas
#    y el tráfico no autorizado no es bloqueado (requiere Canal o Cilium para aislamiento).
#
# Idempotente: re-ejecutar este playbook sobre el clúster existente deja los recursos sin cambios (changed=0).

- name: Verify Flannel CNI Overlay and Policy Enforcement Mechanics
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  vars:
    local_kubeconfig: "{{ lookup('env', 'PWD') }}/kubeconfig.yaml"
    test_namespace: default
    primary_server: "{{ groups['rke2_servers'][0] }}"
    workers: "{{ groups['rke2_workers'] }}"
  tasks:
    - name: Check if rke2_cni is set to flannel
      ansible.builtin.debug:
        msg: "Executing Flannel CNI specific test suite (rke2_cni={{ rke2_cni }})"
      when: rke2_cni | default('') == 'flannel'

    - name: Skip Flannel CNI tests if another CNI is configured
      ansible.builtin.debug:
        msg: "Skipping Flannel CNI tests because rke2_cni is set to '{{ rke2_cni }}'"
      when: rke2_cni | default('') != 'flannel'

    - name: Run Flannel CNI verification block
      when: rke2_cni | default('') == 'flannel'
      block:
        - name: Query active Flannel DaemonSets in kube-system
          kubernetes.core.k8s_info:
            api_version: apps/v1
            kind: DaemonSet
            namespace: kube-system
            kubeconfig: "{{ local_kubeconfig }}"
          register: kube_system_ds

        - name: Identify Flannel DaemonSet
          ansible.builtin.set_fact:
            flannel_ds_found: >-
              {{
                kube_system_ds.resources | map(attribute='metadata.name') | list |
                select('search', 'flannel') | list
              }}

        - name: Assert Flannel DaemonSet is active
          ansible.builtin.assert:
            that:
              - flannel_ds_found | length > 0
            fail_msg: "Flannel DaemonSet (kube-flannel-ds / rke2-flannel) not found in kube-system namespace"
            success_msg: "Flannel DaemonSet ({{ flannel_ds_found | join(', ') }}) is active and running."

        - name: Deploy Flannel receiver server Pod on worker node 1
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ local_kubeconfig }}"
            definition:
              apiVersion: v1
              kind: Pod
              metadata:
                name: flannel-receiver-pod
                namespace: "{{ test_namespace }}"
                labels:
                  app: flannel-backend
              spec:
                restartPolicy: Always
                nodeName: "{{ workers[0] }}"
                containers:
                  - name: server
                    image: busybox:1.36
                    command:
                      - sh
                      - -c
                      - 'while true; do echo -e "HTTP/1.1 200 OK\r\nContent-Length: 19\r\n\r\nHello from Flannel" | nc -ll -p 8080; done'

        - name: Deploy Flannel authorized sender Pod on worker node 2
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ local_kubeconfig }}"
            definition:
              apiVersion: v1
              kind: Pod
              metadata:
                name: flannel-sender-pod
                namespace: "{{ test_namespace }}"
                labels:
                  app: flannel-frontend
              spec:
                restartPolicy: Always
                nodeName: "{{ workers[1] if workers | length > 1 else workers[0] }}"
                containers:
                  - name: client
                    image: busybox:1.36
                    command: ["sleep", "3600"]

        - name: Deploy Flannel unauthorized rogue Pod on worker node 2
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ local_kubeconfig }}"
            definition:
              apiVersion: v1
              kind: Pod
              metadata:
                name: flannel-rogue-pod
                namespace: "{{ test_namespace }}"
                labels:
                  app: flannel-rogue
              spec:
                restartPolicy: Always
                nodeName: "{{ workers[1] if workers | length > 1 else workers[0] }}"
                containers:
                  - name: client
                    image: busybox:1.36
                    command: ["sleep", "3600"]

        - name: Wait for Flannel test Pods to reach Running status
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            name: "{{ item }}"
            namespace: "{{ test_namespace }}"
            kubeconfig: "{{ local_kubeconfig }}"
          register: flannel_pods
          retries: 60
          delay: 5
          until: >
            flannel_pods.resources | default([]) | length > 0 and
            (flannel_pods.resources[0].status.phase | default('')) == 'Running'
          loop:
            - flannel-receiver-pod
            - flannel-sender-pod
            - flannel-rogue-pod

        - name: Extract Flannel receiver Pod status details
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            name: flannel-receiver-pod
            namespace: "{{ test_namespace }}"
            kubeconfig: "{{ local_kubeconfig }}"
          register: receiver_info

        - name: Store receiver Pod IP address
          ansible.builtin.set_fact:
            receiver_ip: "{{ receiver_info.resources[0].status.podIP }}"

        - name: Apply NetworkPolicy attempting to isolate flannel-backend
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ local_kubeconfig }}"
            definition:
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: flannel-deny-rogue-policy
                namespace: "{{ test_namespace }}"
              spec:
                podSelector:
                  matchLabels:
                    app: flannel-backend
                policyTypes:
                  - Ingress
                ingress:
                  - from:
                      - podSelector:
                          matchLabels:
                            app: flannel-frontend
                    ports:
                      - protocol: TCP
                        port: 8080

        - name: Test inter-node connectivity from authorized sender over Flannel VXLAN overlay
          ansible.builtin.command: >-
            kubectl --kubeconfig {{ local_kubeconfig }}
            exec -n {{ test_namespace }} flannel-sender-pod --
            nc -z -w 3 {{ receiver_ip }} 8080
          register: sender_connectivity
          changed_when: false

        - name: Test connectivity from rogue pod (demonstrating Flannel policy limitation)
          ansible.builtin.command: >-
            kubectl --kubeconfig {{ local_kubeconfig }}
            exec -n {{ test_namespace }} flannel-rogue-pod --
            nc -z -w 3 {{ receiver_ip }} 8080
          register: rogue_connectivity
          ignore_errors: true
          changed_when: false

        - name: Assert Flannel inter-node overlay connectivity succeeds for all traffic
          ansible.builtin.assert:
            that:
              - sender_connectivity.rc == 0
              - rogue_connectivity.rc == 0
            fail_msg: "Flannel VXLAN inter-node traffic test failed"
            success_msg: "Flannel VXLAN inter-node routing is functional; NetworkPolicy was ignored by design."

        - name: Display Flannel CNI overview and verification banner
          ansible.builtin.debug:
            msg: |
              ════════════════════════════════════════════════════════════════
                Ejemplo 2: CNI Flannel (VXLAN Overlay Routing) Verificado!

                Receiver Pod IP: {{ receiver_ip }}:8080
                Flannel DaemonSet: {{ flannel_ds_found | join(', ') }}

                ✓ Tráfico inter-nodo sobre Flannel VXLAN (UDP 8472): OK
                ✓ Demostración de NetworkPolicy ignorada por diseño:
                  - Sender autorizado -> Receiver: PERMITIDO
                  - Rogue no autorizado -> Receiver: PERMITIDO (Flannel NO filtra)

                Mecánica y Recomendaciones de Flannel CNI:
                - Ideal para laboratorios o clústeres donde la seguridad L3/L4
                  se gestiona externamente y se busca mínimo consumo de CPU/RAM.
                - Si requiere aislamiento entre Pods (NetworkPolicies), use:
                  • rke2_cni: canal (Flannel + Calico Felix)
                  • rke2_cni: cilium (eBPF Native)
              ════════════════════════════════════════════════════════════════
