lxd_network: "lxdbr0"
lxd_image: "k8s-template"
rke2_version: "v1.36.3+rke2r1"
rke2_cni: "canal"
rke2_token: "secret-rke2-observability-token-2026"

# Longhorn storage version
longhorn_chart_version: "1.12.0"
longhorn_namespace: "longhorn-system"

# Observability Stack settings
monitoring_namespace: "monitoring"
logging_namespace: "logging"

# Grafana and Prometheus Web UI access
grafana_admin_password: "admin"
grafana_nodeport: 30080
prometheus_nodeport: 30090
